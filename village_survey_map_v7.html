    viewCanvas.style.cursor = (mode === 'pan') ? 'grab' : 'crosshair';

    closePolyBtn.style.display       = showB ? 'inline-flex' : 'none';
    undoBoundaryBtn.style.display    = showB ? 'inline-flex' : 'none';
    clearBoundaryBtn.style.display   = showB ? 'inline-flex' : 'none';

    geomPolyBtn.style.display        = showF ? 'inline-flex' : 'none';
    geomPinBtn.style.display         = showF ? 'inline-flex' : 'none';
    featSep.style.display            = showF ? 'inline-block' : 'none';
    finishFeatBtn.style.display      = isPolySub ? 'inline-flex' : 'none';
    undoFeatBtn.style.display        = isPolySub ? 'inline-flex' : 'none';
    cancelFeatBtn.style.display      = isPolySub ? 'inline-flex' : 'none';
    toggleEditSavedBtn.style.display = showF ? 'inline-flex' : 'none';

    dropGpsPtBtn.style.display       = (showB || showF) ? 'inline-flex' : 'none';
    dropGpsPtBtn.disabled            = !hasImg || (showF && editSavedVertices);

    cancelScaleBtn.style.display     = showS ? 'inline-flex' : 'none';

    doneGeorefBtn.style.display      = showG ? 'inline-flex' : 'none';
    undoGcpBtn.style.display         = showG ? 'inline-flex' : 'none';
    clearGcpBtn.style.display        = showG ? 'inline-flex' : 'none';
    undoGcpBtn.disabled              = gcps.length === 0;
    clearGcpBtn.disabled             = gcps.length === 0;

    geomPolyBtn.disabled  = !hasImg;
    geomPinBtn.disabled   = !hasImg;
    geomPolyBtn.className = (featGeom === 'polygon' && !editSavedVertices) ? 'btn-active-green' : '';
    geomPinBtn.className  = (featGeom === 'point'   && !editSavedVertices) ? 'btn-active-green' : '';

    closePolyBtn.disabled       = !hasImg || closed || points.length < 3;
    undoBoundaryBtn.disabled    = !hasImg || points.length === 0;
    clearBoundaryBtn.disabled   = !hasImg || points.length === 0;

    finishFeatBtn.disabled      = !hasImg || draftPoints.length < 3;
    undoFeatBtn.disabled        = !hasImg || draftPoints.length === 0;
    cancelFeatBtn.disabled      = !hasImg || draftPoints.length === 0;
    toggleEditSavedBtn.disabled = !hasImg || features.length === 0 || draftPoints.length > 0;
    toggleEditSavedBtn.className = editSavedVertices ? 'btn-active-purple' : '';
    toggleEditSavedBtn.textContent = editSavedVertices ? L.editSavedOn : L.editSavedOff;

    saveCropBtn.disabled       = !hasImg || !closed;
    saveFullBtn.disabled       = !hasImg || (!closed && features.length === 0);
    exportJsonBtn.disabled     = !hasImg || (points.length < 3 && features.length === 0 && gcps.length === 0);
    exportZipBtn.disabled      = !hasImg || (points.length < 3 && features.length === 0);
    exportRefSheetBtn.disabled = !hasImg || features.length === 0;

    georefInfoLbl.textContent = georefModel
      ? L.georefOk(gcps.length, georefModel.rmsPx.toFixed(1))
      : L.georefNone(gcps.length);

    scaleInfoLbl.textContent = metersPerPixel
      ? L.scaleCal((1 / metersPerPixel).toFixed(2))
      : L.scaleUncal;

    if (!hasImg) {
      statusBar.innerHTML = L.statusStart;
    } else if (mode === 'georef') {
      statusBar.innerHTML = L.statusGeoref(gcps.length);
    } else if (mode === 'boundary') {
      if (!closed) {
        if (points.length === 0) statusBar.innerHTML = L.statusB0;
        else if (points.length < 3) statusBar.innerHTML = L.statusBNeed(points.length, 3 - points.length);
        else statusBar.innerHTML = L.statusBReady(points.length);
      } else {
        const g = computeGridModel();
        statusBar.innerHTML = L.statusBDone(g ? g.labels.length : 0);
      }
    } else if (mode === 'feature') {
      if (editSavedVertices && draftPoints.length === 0) {
        statusBar.innerHTML = L.statusEditSaved;
      } else if (featGeom === 'point') {
        statusBar.innerHTML = L.statusFPin(features.length);
      } else if (draftPoints.length === 0) {
        statusBar.innerHTML = L.statusFPoly0(features.length);
      } else if (draftPoints.length < 3) {
        statusBar.innerHTML = L.statusFPolyNeed(formatId(nextFeatNum), draftPoints.length, 3 - draftPoints.length);
      } else {
        statusBar.innerHTML = L.statusFPolyReady(formatId(nextFeatNum), draftPoints.length);
      }
    } else if (mode === 'scale') {
      statusBar.innerHTML = (scalePoints.length === 0) ? L.statusScale1 : L.statusScale2;
    } else {
      statusBar.innerHTML = L.statusPan;
    }
    if (lastSavedMode === 'full' || lastSavedMode === 'lite') {
      const chip = document.createElement('span');
      chip.className = 'autosave-chip';
      chip.textContent = `💾 ${lastSavedTimeStr}`;
      statusBar.appendChild(chip);
    }
    updateCleanHud();
  }

  // --- Feature Modal & Photo Thumbnails with Compass Bearing ---
  function renderModalThumbs() {
    const L = t();
    modalThumbStrip.innerHTML = '';
    if (isProcessingPhotos) {
      photoHintLbl.textContent = L.photoHintProcessing;
      modalSaveBtn.disabled = true;
      return;
    }
    modalSaveBtn.disabled = false;

    if (modalDraftPhotos.length === 0) {
      photoHintLbl.textContent = L.photoHintIdle;
      return;
    }
    const totalKB = modalDraftPhotos.reduce((s, p) => s + (p.sizeKB || 0), 0);
    photoHintLbl.textContent = L.photoAttachedCount(modalDraftPhotos.length, totalKB);

    const activeId = (editingFeatIndex >= 0) ? features[editingFeatIndex].id : formatId(nextFeatNum);
    modalDraftPhotos.forEach((ph, idx) => {
      const card = document.createElement('div');
      card.className = 'thumb-card';

      const im = document.createElement('img');
      im.src = ph.dataUrl;
      im.alt = ph.origName;
      im.onclick = () => {
        const bTxt = ph.bearing ? ` | 🧭 ${ph.bearing}` : '';
        openLightbox(ph.dataUrl, `${activeId} — ${buildPhotoExportPath(activeId, idx, ph.origName)}${bTxt}`);
      };

      const cap = document.createElement('div');
      cap.className = 'thumb-cap';
      cap.textContent = ph.origName;

      // Compass bearing selector + live stamp button
      const dirRow = document.createElement('div');
      dirRow.className = 'thumb-dir-row';

      const sel = document.createElement('select');
      sel.className = 'thumb-dir-sel';
      const optNone = document.createElement('option');
      optNone.value = '';
      optNone.textContent = L.dirNone;
      sel.appendChild(optNone);

      // If stamped with exact degree bearing not in 8 cardinals, add custom option
      const isCustom = ph.bearing && !CARDINALS.includes(ph.bearing);
      if (isCustom) {
        const oCust = document.createElement('option');
        oCust.value = ph.bearing;
        oCust.textContent = ph.bearing;
        sel.appendChild(oCust);
      }
      CARDINALS.forEach(c => {
        const o = document.createElement('option');
        o.value = c;
        o.textContent = c;
        sel.appendChild(o);
      });
      sel.value = ph.bearing || '';
      sel.onchange = () => { ph.bearing = sel.value; };

      const stampBtn = document.createElement('button');
      stampBtn.type = 'button';
      stampBtn.className = 'thumb-dir-btn';
      stampBtn.title = L.dirStampTitle;
      stampBtn.textContent = '🧭';
      stampBtn.onclick = () => {
        if (!compassActive || compassHeading === null) {
          showToast(L.toastCompassNeedLive, 3500);
          return;
        }
        const d = Math.round(compassHeading) % 360;
        ph.bearing = `${d}° ${degToCardinal(d)}`;
        renderModalThumbs();
      };

      dirRow.appendChild(sel);
      dirRow.appendChild(stampBtn);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'thumb-del';
      del.textContent = '×';
      del.onclick = () => {
        const removed = modalDraftPhotos.splice(idx, 1)[0];
        if (removed && removed.origName) {
          const parts = featPhotoIn.value.split(',').map(s => s.trim()).filter(Boolean);
          const pos = parts.indexOf(removed.origName);
          if (pos !== -1) {
            parts.splice(pos, 1);
            featPhotoIn.value = parts.join(', ');
          }
        }
        renderModalThumbs();
      };

      card.appendChild(im);
      card.appendChild(cap);
      card.appendChild(dirRow);
      card.appendChild(del);
      modalThumbStrip.appendChild(card);
    });
  }

  photoFilePicker.onchange = async e => {
    const files = Array.from(e.target.files || []);
    photoFilePicker.value = '';
    if (!files.length) return;
    isProcessingPhotos = true;
    renderModalThumbs();
    for (const f of files) {
      try {
        const compressed = await compressImageFile(f, 1024, 0.82);
        modalDraftPhotos.push(compressed);
        const parts = featPhotoIn.value.split(',').map(s => s.trim()).filter(Boolean);
        if (!parts.includes(compressed.origName)) {
          parts.push(compressed.origName);
          featPhotoIn.value = parts.join(', ');
        }
      } catch {}
    }
    isProcessingPhotos = false;
    renderModalThumbs();
  };

  // --- Hit Testing ---
  function findHitTarget(sx, sy) {
    const hitR = 22;
    let best = null;
    let bestD = hitR;

    const checkList = (arr, makeTarget) => {
      for (let i = 0; i < arr.length; i++) {
        const sp = imageToScreen(arr[i].x, arr[i].y);
        const d = Math.hypot(sp.x - sx, sp.y - sy);
        if (d <= bestD) {
          bestD = d;
          best = makeTarget(i);
        }
      }
    };

    if (mode === 'boundary') {
      checkList(points, idx => ({ kind: 'boundary', idx }));
    } else if (mode === 'feature') {
      if (draftPoints.length > 0 && featGeom === 'polygon') {
        checkList(draftPoints, idx => ({ kind: 'draft', idx }));
      } else if (editSavedVertices) {
        for (let fi = 0; fi < features.length; fi++) {
          if (!isFeatureVisible(features[fi])) continue;
          checkList(features[fi].points, idx => ({ kind: 'feature', featIdx: fi, idx }));
        }
      }
    }
    return best;
  }

  // --- Pointer & Multi-Touch ---
  function getLocalPos(e) {
    const rect = viewCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  viewCanvas.addEventListener('pointerdown', e => {
    if (!img) return;
    viewCanvas.setPointerCapture(e.pointerId);
    const pos = getLocalPos(e);
    activePointers.set(e.pointerId, pos);

    if (activePointers.size === 2) {
      dragTarget = null;
      isPanning = false;
      const [p1, p2] = Array.from(activePointers.values());
      pinchStartDist = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
      pinchStartZoom = zoom;
      pinchStartMid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      pinchStartPan = { x: panX, y: panY };
      return;
    }

    if (activePointers.size === 1) {
      downPos = pos;
      panStart = { x: panX, y: panY };
      movedDist = 0;

      if (mode === 'boundary' || mode === 'feature') {
        const hit = findHitTarget(pos.x, pos.y);
        if (hit) {
          dragTarget = hit;
          return;
        }
      }
      isPanning = true;
    }
  });

  viewCanvas.addEventListener('pointermove', e => {
    if (!img || !activePointers.has(e.pointerId)) return;
    const pos = getLocalPos(e);
    activePointers.set(e.pointerId, pos);

    if (activePointers.size === 2 && pinchStartMid) {
      const [p1, p2] = Array.from(activePointers.values());
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const newZoom = clamp(pinchStartZoom * (dist / pinchStartDist), 0.15, 14);
      const ratio = newZoom / pinchStartZoom;
      zoom = newZoom;
      panX = mid.x - (pinchStartMid.x - pinchStartPan.x) * ratio;
      panY = mid.y - (pinchStartMid.y - pinchStartPan.y) * ratio;
      renderView();
      return;
    }

    if (activePointers.size === 1 && downPos) {
      const dx = pos.x - downPos.x;
      const dy = pos.y - downPos.y;
      movedDist = Math.max(movedDist, Math.hypot(dx, dy));

      if (dragTarget) {
        if (movedDist > 4) {
          const ip = screenToImage(pos.x, pos.y);
          const clampedPt = {
            x: clamp(ip.x, 0, img.naturalWidth),
            y: clamp(ip.y, 0, img.naturalHeight)
          };
          if (dragTarget.kind === 'boundary') {
            points[dragTarget.idx] = clampedPt;
          } else if (dragTarget.kind === 'draft') {
            draftPoints[dragTarget.idx] = clampedPt;
          } else if (dragTarget.kind === 'feature') {
            features[dragTarget.featIdx].points[dragTarget.idx] = clampedPt;
          }
          renderView();
        }
      } else if (isPanning && movedDist > 4) {
        panX = panStart.x + dx;
        panY = panStart.y + dy;
        renderView();
      }
    }
  });

  function endPointer(e) {
    if (!activePointers.has(e.pointerId)) return;
    const pos = getLocalPos(e);
    const wasSingle = activePointers.size === 1;
    const wasDragged = !!dragTarget && movedDist > 4;
    const prevDrag = dragTarget;
    activePointers.delete(e.pointerId);

    if (wasSingle && downPos && movedDist <= 8) {
      const ip = screenToImage(pos.x, pos.y);
      const inBounds = ip.x >= 0 && ip.x <= img.naturalWidth && ip.y >= 0 && ip.y <= img.naturalHeight;

      if (mode === 'georef' && inBounds) {
        openCoordModal('gcp', ip);
      } else if (mode === 'boundary') {
        if (!closed && prevDrag && prevDrag.kind === 'boundary' && prevDrag.idx === 0 && points.length >= 3) {
          closed = true;
          scheduleAutoSave();
        } else if (!closed && !prevDrag && inBounds) {
          points.push(ip);
          scheduleAutoSave();
        }
      } else if (mode === 'feature') {
        if (!editSavedVertices) {
          if (featGeom === 'point' && inBounds) {
            draftPoints = [ip];
            openFeatureModal(-1, 'point');
          } else if (featGeom === 'polygon') {
            if (prevDrag && prevDrag.kind === 'draft' && prevDrag.idx === 0 && draftPoints.length >= 3) {
              openFeatureModal(-1, 'polygon');
            } else if (!prevDrag && inBounds) {
              modalGeom = 'polygon';
              draftPoints.push(ip);
            }
          }
        }
      } else if (mode === 'scale' && inBounds) {
        scalePoints.push(ip);
        renderView();
        if (scalePoints.length === 2) {
          const pxDist = Math.hypot(scalePoints[1].x - scalePoints[0].x, scalePoints[1].y - scalePoints[0].y);

          scalePoints = [];
          mode = 'feature';
        }
      }
    } else if (wasDragged && prevDrag && (prevDrag.kind === 'feature' || prevDrag.kind === 'boundary')) {
      renderFeaturesList();
      scheduleAutoSave();
    }

    if (activePointers.size === 0) {
      dragTarget = null;
      isPanning = false;
      downPos = null;
      pinchStartMid = null;
    }
    updateUI();
    renderView();
  }

  viewCanvas.addEventListener('pointerup', endPointer);

  // --- Map Canvas Builders ---
  function renderFullMapCanvas() {
    const fullCv = document.createElement('canvas');
    fullCv.width = img.naturalWidth;
    fullCv.height = img.naturalHeight;
    drawSceneOnContext(fullCv.getContext('2d'), true);
    return fullCv;
  }

  function renderCroppedMapCanvas(fullCv) {
    if (!closed || points.length < 3) return null;
    const W = img.naturalWidth, H = img.naturalHeight;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of points) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
    const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.05);
    const sx = Math.max(0, Math.floor(minX - pad));
    const sy = Math.max(0, Math.floor(minY - pad));
    const ex = Math.min(W, Math.ceil(maxX + pad));
    const ey = Math.min(H, Math.ceil(maxY + pad));
    const cw = Math.max(1, ex - sx);
    const ch = Math.max(1, ey - sy);

    const cropCv = document.createElement('canvas');
    cropCv.width = cw;
    cropCv.height = ch;
    cropCv.getContext('2d').drawImage(fullCv, sx, sy, cw, ch, 0, 0, cw, ch);
    return cropCv;
  }

  function exportImage(cropOnly) {
    if (!img) return;
    if (cropOnly && (!closed || points.length < 3)) return;
    const fullCv = renderFullMapCanvas();
    const outCanvas = cropOnly ? renderCroppedMapCanvas(fullCv) : fullCv;
    if (!outCanvas) return;
    outCanvas.toBlob(blob => {
      if (!blob) return;
      triggerDownloadBlob(blob, cropOnly ? 'village_marked_crop.png' : 'village_marked_full.png');
    }, 'image/png');
  }

  saveCropBtn.onclick = () => exportImage(true);
  saveFullBtn.onclick = () => exportImage(false);

  // --- AI Visual Reference Sheet PNG Generator ---
  function wrapLines(ctx, text, maxW, maxLines) {
    if (!text) return [];
    const words = String(text).split(/\s+/);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? (cur + ' ' + w) : w;
      if (ctx.measureText(test).width <= maxW) {
        cur = test;
      } else {
        if (cur) lines.push(cur);
        cur = w;
        if (lines.length >= maxLines) break;
      }
    }
    if (cur && lines.length < maxLines) lines.push(cur);
    return lines.slice(0, maxLines);
  }

  function drawImageContain(ctx, im, x, y, w, h) {
    const scale = Math.min(w / im.naturalWidth, h / im.naturalHeight);
    const dw = im.naturalWidth * scale;
    const dh = im.naturalHeight * scale;
    ctx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }

  async function generateReferenceSheetCanvas() {
    if (!img || features.length === 0) return null;
    const L = t();
    const ordered = [...features].sort((a, b) => (TYPE_STYLES[a.type]?.order || 4) - (TYPE_STYLES[b.type]?.order || 4));

    const loadedPhotoLists = await Promise.all(ordered.map(async f => {
      const list = (f.photos || []).slice(0, 3);
      return Promise.all(list.map(async (ph, idx) => ({
        im: await loadImageFromUrl(ph.dataUrl),
        exportName: buildPhotoExportPath(f.id, idx, ph.origName),
        bearing: ph.bearing || ''
      })));
    }));

    const sheetW = 1400;
    const pad = 22;
    const headerH = 92;
    const cardH = 340;
    const cardGap = 18;
    const sheetH = headerH + pad + ordered.length * (cardH + cardGap) + pad;

    const cv = document.createElement('canvas');
    cv.width = sheetW;
    cv.height = sheetH;
    const ctx = cv.getContext('2d');

    ctx.fillStyle = '#070d1a';
    ctx.fillRect(0, 0, sheetW, sheetH);

    ctx.fillStyle = '#0f1b33';
    ctx.fillRect(0, 0, sheetW, headerH);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, headerH); ctx.lineTo(sheetW, headerH); ctx.stroke();

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 24px monospace, Tahoma, Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(L.refSheetTitle, pad, 18);

    const scaleTxt = metersPerPixel ? `${(1 / metersPerPixel).toFixed(2)} px/m` : 'Uncalibrated';
    const georefTxt = georefModel ? `Georef: ${gcps.length} GCPs` : 'No Georef';
    const counts = { REM: 0, REP: 0, MOD: 0, ADD: 0 };
    ordered.forEach(f => { if (counts[f.type] !== undefined) counts[f.type]++; });
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '14px monospace, Tahoma, Arial';
    ctx.fillText(
      `Base Map: ${img.naturalWidth}x${img.naturalHeight}px | ${scaleTxt} | ${georefTxt} | Total: ${ordered.length} (REM:${counts.REM}, REP:${counts.REP}, MOD:${counts.MOD}, ADD:${counts.ADD})`,
      pad, 56
    );

    const W = img.naturalWidth, H = img.naturalHeight;

    ordered.forEach((f, idx) => {
      const y0 = headerH + pad + idx * (cardH + cardGap);
      const st = TYPE_STYLES[f.type] || TYPE_STYLES.ADD;
      const isPin = (f.geometry === 'point' || f.points.length === 1);
      const cardW = sheetW - pad * 2;

      ctx.fillStyle = '#101a2e';
      ctx.fillRect(pad, y0, cardW, cardH);
      ctx.strokeStyle = st.stroke;
      ctx.lineWidth = 2;
      ctx.strokeRect(pad, y0, cardW, cardH);

      const chH = 40;
      ctx.fillStyle = '#162440';
      ctx.fillRect(pad, y0, cardW, chH);
      ctx.fillStyle = st.stroke;
      ctx.fillRect(pad, y0, 10, chH);

      const sectors = detectFeatureSectors(f.points);
      const secStr = sectors.length ? `Sector: ${sectors.join(',')}` : 'Sector: N/A';
      const geomStr = isPin ? 'PIN' : 'POLYGON';
      let dimStr = '';
      if (!isPin && metersPerPixel) {
        const m = polyAreaCentroidXY(f.points);
        dimStr = ` | ${(m.areaPx * metersPerPixel * metersPerPixel).toFixed(1)} m²`;
      }
      ctx.fillStyle = st.badge;
      ctx.font = 'bold 17px monospace, Tahoma, Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(
        `${f.id}  [${f.type} / ${geomStr}]  ${f.name || '(Unnamed)'}   —   ${secStr}${dimStr}`,
        pad + 20, y0 + chH / 2
      );

      // Left box: Map Context Crop
      const mapX = pad + 14;
      const mapY = y0 + chH + 26;
      const mapW = 330;
      const mapH = 200;

      ctx.fillStyle = '#7dd3fc';
      ctx.font = 'bold 12px monospace, Tahoma, Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(L.refSheetMapCtx, mapX, mapY - 4);

      ctx.fillStyle = '#050a14';
      ctx.fillRect(mapX, mapY, mapW, mapH);

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of f.points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const span = isPin ? Math.max(120, Math.min(W, H) * 0.16) : Math.max(maxX - minX, maxY - minY) * 2.4;
      const halfW = Math.max(80, span * 0.6);
      const halfH = halfW * (mapH / mapW);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      let sx = cx - halfW, sy = cy - halfH, sw = halfW * 2, sh = halfH * 2;
      if (sw > W) { sw = W; sh = sw * (mapH / mapW); }
      if (sh > H) { sh = H; sw = sh * (mapW / mapH); }
      sx = clamp(sx, 0, Math.max(0, W - sw));
      sy = clamp(sy, 0, Math.max(0, H - sh));

      ctx.save();
      ctx.beginPath();
      ctx.rect(mapX, mapY, mapW, mapH);
      ctx.clip();
      ctx.drawImage(img, sx, sy, sw, sh, mapX, mapY, mapW, mapH);

      const toBox = p => ({
        x: mapX + ((p.x - sx) / sw) * mapW,
        y: mapY + ((p.y - sy) / sh) * mapH
      });
      if (isPin) {
        const bp = toBox(f.points[0]);
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = st.stroke;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      } else {
        ctx.beginPath();
        const b0 = toBox(f.points[0]);
        ctx.moveTo(b0.x, b0.y);
        for (let k = 1; k < f.points.length; k++) {
          const bk = toBox(f.points[k]);
          ctx.lineTo(bk.x, bk.y);
        }
        ctx.closePath();
        ctx.fillStyle = st.fill;
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4.5;
        ctx.stroke();
        ctx.strokeStyle = st.stroke;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(mapX, mapY, mapW, mapH);

      // Right area: Attached Field Photos + Camera Bearing
      const phX = mapX + mapW + 20;
      const phW = cardW - (mapW + 48);
      const phY = mapY;
      const phH = mapH;

      ctx.fillStyle = '#d8b4fe';
      ctx.font = 'bold 12px monospace, Tahoma, Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      const extraCnt = Math.max(0, (f.photos ? f.photos.length : 0) - 3);
      const extraTag = extraCnt > 0 ? ` (+${extraCnt} in ZIP/photos/)` : '';
      ctx.fillText(`${L.refSheetFieldPhotos}${extraTag}`, phX, phY - 4);

      const loaded = (loadedPhotoLists[idx] || []).filter(item => item.im);
      if (loaded.length === 0) {
        ctx.fillStyle = '#080f1d';
        ctx.fillRect(phX, phY, phW, phH);
        ctx.strokeStyle = '#1e3354';
        ctx.lineWidth = 1;
        ctx.strokeRect(phX, phY, phW, phH);
        ctx.fillStyle = '#64748b';
        ctx.font = '14px monospace, Tahoma, Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.photoRef ? `Ref: ${f.photoRef}` : L.refSheetNoPhoto, phX + phW / 2, phY + phH / 2);
      } else {
        const slotGap = 12;
        const slotW = (phW - slotGap * (loaded.length - 1)) / loaded.length;
        loaded.forEach((item, pi) => {
          const bx = phX + pi * (slotW + slotGap);
          ctx.fillStyle = '#050a14';
          ctx.fillRect(bx, phY, slotW, phH);
          drawImageContain(ctx, item.im, bx + 4, phY + 4, slotW - 8, phH - 28);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1.2;
          ctx.strokeRect(bx, phY, slotW, phH);

          ctx.fillStyle = 'rgba(8, 15, 29, 0.92)';
          ctx.fillRect(bx, phY + phH - 22, slotW, 22);
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '11px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const dirTag = item.bearing ? ` | Cam->${item.bearing}` : '';
          ctx.fillText(`${item.exportName}${dirTag}`, bx + slotW / 2, phY + phH - 11, slotW - 8);
        });
      }

      // Bottom Instructions Strip
      const noteY = mapY + mapH + 10;
      const noteH = cardH - (noteY - y0) - 10;
      ctx.fillStyle = '#080f1d';
      ctx.fillRect(mapX, noteY, cardW - 28, noteH);
      ctx.strokeStyle = '#1e3354';
      ctx.lineWidth = 1;
      ctx.strokeRect(mapX, noteY, cardW - 28, noteH);

      let noteLine = '';
      if (f.type === 'REP') {
        noteLine = `[STEP 1 REMOVE]: ${f.removeNotes || '-'}   ||   [STEP 2 ADD]: ${f.addNotes || '-'}`;
      } else {
        noteLine = `[${f.type} INSTRUCTIONS]: ${f.notes || '-'}`;
      }
      const ctr = polyAreaCentroidXY(f.points);
      const ll = imageXYToLatLon(ctr.cx, ctr.cy);
      const gpsTxt = ll ? ` | GPS: ${ll.lat.toFixed(6)}, ${ll.lon.toFixed(6)}` : '';
      const bboxTxt = isPin
        ? `Px: (${Math.round(f.points[0].x)},${Math.round(f.points[0].y)})${gpsTxt}`
        : `BBox px: (${Math.round(minX)},${Math.round(minY)})-(${Math.round(maxX)},${Math.round(maxY)})${gpsTxt}`;

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '13px Tahoma, Arial, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const wrapped = wrapLines(ctx, `${noteLine}  |  ${bboxTxt}`, cardW - 48, 2);
      wrapped.forEach((ln, li) => {
        ctx.fillText(ln, mapX + 10, noteY + 8 + li * 20, cardW - 48);
      });
    });

    return cv;
  }

  // --- Structured JSON Payload & AI Prompt Brief (v6: includes GCPs, Lat/Lon, Camera Bearings) ---
  function buildProjectPayload(includeBase64Photos) {
    const round2 = v => Math.round(v * 100) / 100;

    const mapPointObj = p => {
      const obj = { x: round2(p.x), y: round2(p.y) };
      const ll = imageXYToLatLon(p.x, p.y);
      if (ll) { obj.lat = ll.lat; obj.lon = ll.lon; }
      return obj;
    };

    const exportedFeatures = features.map(f => {
      const isPin = (f.geometry === 'point' || f.points.length === 1);
      const photoEntries = (f.photos || []).map((ph, pi) => {
        const pObj = {
          file: buildPhotoExportPath(f.id, pi, ph.origName),
          origName: ph.origName,
          cameraBearing: ph.bearing || '',
          width: ph.width,
          height: ph.height
        };
        if (includeBase64Photos) pObj.dataUrl = ph.dataUrl;
        return pObj;
      });

      const entry = {
        id: f.id,
        geometry: isPin ? 'point' : 'polygon',
        type: f.type,
        executionOrder: TYPE_STYLES[f.type]?.order || 4,
        name: f.name,
        photoRef: f.photoRef || '',
        photos: photoEntries,
        sectors: detectFeatureSectors(f.points),
        points: f.points.map(mapPointObj)
      };
      if (f.type === 'REP') {
        entry.removeNotes = f.removeNotes || '';
        entry.addNotes = f.addNotes || '';
      } else {
        entry.notes = f.notes || '';
      }
      if (!isPin && metersPerPixel) {
        const m = polyAreaCentroidXY(f.points);
        entry.areaM2 = round2(m.areaPx * metersPerPixel * metersPerPixel);
        entry.perimeterM = round2(m.perimeterPx * metersPerPixel);
      }
      return entry;
    });

    const executionPlan = {
      pass1_removals: exportedFeatures
        .filter(f => f.type === 'REM' || f.type === 'REP')
        .map(f => ({
          id: f.id,
          geometry: f.geometry,
          sourceType: f.type,
          name: f.name,
          photos: f.photos.map(p => ({ file: p.file, cameraBearing: p.cameraBearing })),
          action: f.type === 'REP' ? f.removeNotes : f.notes
        })),
      pass2_modifications: exportedFeatures
        .filter(f => f.type === 'MOD')
        .map(f => ({
          id: f.id,
          geometry: f.geometry,
          name: f.name,
          photos: f.photos.map(p => ({ file: p.file, cameraBearing: p.cameraBearing })),
          action: f.notes
        })),
      pass3_additions: exportedFeatures
        .filter(f => f.type === 'ADD' || f.type === 'REP')
        .map(f => ({
          id: f.id,
          geometry: f.geometry,
          sourceType: f.type,
          name: f.name,
          photos: f.photos.map(p => ({ file: p.file, cameraBearing: p.cameraBearing })),
          action: f.type === 'REP' ? f.addNotes : f.notes
        }))
    };

    return {
      version: 6,
      language: lang,
      aiAgentGuide: {
        purpose: 'Update a base top-down satellite map by simulating & compositing field-verified changes without distorting untouched areas.',
        strictExecutionOrder: ['pass1_removals', 'pass2_modifications', 'pass3_additions'],
        photoUsage: 'Each feature.photos[] entry links ground/oblique field photos (with optional cameraBearing showing which compass direction the camera faced) to that exact feature ID so an AI agent can simulate an accurate 90-degree orthographic top-down view.'
      },
      imageWidth: img.naturalWidth,
      imageHeight: img.naturalHeight,
      metersPerPixel: metersPerPixel ? Number(metersPerPixel.toFixed(6)) : null,
      georeferencing: {
        active: !!georefModel,
        mode: georefModel ? georefModel.mode : null,
        rmsPx: georefModel ? round2(georefModel.rmsPx) : null,
        gcps: gcps.map(g => ({ x: round2(g.x), y: round2(g.y), lat: g.lat, lon: g.lon, label: g.label || '' }))
      },
      grid: {
        cols: parseInt(colsIn.value, 10) || 6,
        rows: parseInt(rowsIn.value, 10) || 4,
        aligned: alignIn.checked
      },
      boundaryClosed: closed,
      points: points.map(mapPointObj),
      executionPlan,
      features: exportedFeatures
    };
  }

  function buildAiPromptBrief(payload) {
    const lines = [];
    lines.push('===============================================================');
    lines.push('AI AGENT SATELLITE MAP UPDATE BRIEF (VILLAGE SURVEY v6)');
    lines.push('===============================================================');
    lines.push(`Base Map Dimensions : ${payload.imageWidth} x ${payload.imageHeight} px`);
    lines.push(`Scale Calibration   : ${payload.metersPerPixel ? (1 / payload.metersPerPixel).toFixed(2) + ' px/m' : 'Uncalibrated'}`);
    lines.push(`Georeferencing      : ${payload.georeferencing.active ? payload.georeferencing.gcps.length + ' GCPs (' + payload.georeferencing.mode + ', RMS ' + payload.georeferencing.rmsPx + 'px)' : 'None'}`);
    lines.push(`Total Marked Items  : ${payload.features.length}`);
    lines.push('');
    lines.push('MANDATORY RULES FOR AI AGENT:');
    lines.push('1. Execute edits in strict 3-pass order: Pass 1 (REM/REP-remove) -> Pass 2 (MOD) -> Pass 3 (ADD/REP-add).');
    lines.push('2. Use each feature\'s linked photo(s) in photos/ and ai_reference_sheet.png (respecting cameraBearing if present) ONLY to inspect real colors, materials, height, and layout, then simulate a 90-degree orthographic top-down view.');
    lines.push('3. Match base map shadow direction, tone/contrast, and image grain. Do NOT alter areas outside marked polygons/pins.');
    lines.push('');

    const fmtPhotos = arr => arr.map(p => p.cameraBearing ? `${p.file} [Cam->${p.cameraBearing}]` : p.file).join(', ');

    const dumpPass = (title, items) => {
      lines.push('---------------------------------------------------------------');
      lines.push(title);
      lines.push('---------------------------------------------------------------');
      if (!items.length) { lines.push('(None)'); lines.push(''); return; }
      items.forEach(item => {
        const tag = item.sourceType ? `${item.sourceType} | ${item.geometry}` : `MOD | ${item.geometry}`;
        lines.push(`- ${item.id} [${tag}] ${item.name || '(Unnamed)'}`);
        lines.push(`  Action : ${item.action || '-'}`);
        if (item.photos.length) lines.push(`  Photos : ${fmtPhotos(item.photos)}`);
      });
      lines.push('');
    };

    dumpPass('PASS 1 — REMOVALS (Clean Plate First)', payload.executionPlan.pass1_removals);
    dumpPass('PASS 2 — MODIFICATIONS', payload.executionPlan.pass2_modifications);
    dumpPass('PASS 3 — ADDITIONS (Simulate 90-deg Top-Down & Blend)', payload.executionPlan.pass3_additions);

    lines.push('---------------------------------------------------------------');
    lines.push('COORDINATE & PHOTO INDEX (Exact Image Pixels & GPS)');
    lines.push('---------------------------------------------------------------');
    payload.features.forEach(f => {
      const ptsStr = f.points.map(p => p.lat !== undefined ? `(${p.x},${p.y} @ ${p.lat},${p.lon})` : `(${p.x},${p.y})`).join(' ');
      const phStr = f.photos.length ? fmtPhotos(f.photos) : (f.photoRef || 'None');
      lines.push(`${f.id} | ${f.type} | ${f.geometry} | Sectors: ${f.sectors.join(',') || 'N/A'} | Name: ${f.name || '-'}`);
      lines.push(`  Photos : ${phStr}`);
      lines.push(`  Points : ${ptsStr}`);
    });
    return lines.join('\n');
  }

  // --- Export Handlers ---
  exportRefSheetBtn.onclick = async () => {
    if (!img || features.length === 0) {
      alert(t().alertNoFeaturesSheet);
      return;
    }
    exportRefSheetBtn.disabled = true;
    try {
      const sheetCv = await generateReferenceSheetCanvas();
      if (sheetCv) {
        sheetCv.toBlob(blob => {
          if (blob) triggerDownloadBlob(blob, 'village_ai_reference_sheet.png');
        }, 'image/png');
      }
    } finally {
      updateUI();
    }
  };

  exportZipBtn.onclick = async () => {
    if (!img) return;
    const L = t();
    exportZipBtn.disabled = true;
    exportZipBtn.textContent = L.exportZipBusy;
    try {
      const entries = [];
      const payload = buildProjectPayload(false);
      entries.push({ name: 'project_ai.json', data: JSON.stringify(payload, null, 2) });
      entries.push({ name: 'AI_PROMPT_BRIEF.txt', data: buildAiPromptBrief(payload) });

      const fullCv = renderFullMapCanvas();
      const fullBytes = await canvasToPngUint8Array(fullCv);
      if (fullBytes) entries.push({ name: 'marked_map_full.png', data: fullBytes });

      if (closed && points.length >= 3) {
        const cropCv = renderCroppedMapCanvas(fullCv);
        const cropBytes = cropCv ? await canvasToPngUint8Array(cropCv) : null;
        if (cropBytes) entries.push({ name: 'marked_map_crop.png', data: cropBytes });
      }

      if (features.length > 0) {
        const sheetCv = await generateReferenceSheetCanvas();
        const sheetBytes = sheetCv ? await canvasToPngUint8Array(sheetCv) : null;
        if (sheetBytes) entries.push({ name: 'ai_reference_sheet.png', data: sheetBytes });
      }

      for (const f of features) {
        if (!f.photos || !f.photos.length) continue;
        f.photos.forEach((ph, pi) => {
          entries.push({ name: buildPhotoExportPath(f.id, pi, ph.origName), data: dataUrlToUint8Array(ph.dataUrl) });
        });
      }

      const zipBlob = buildZipBlob(entries);
      triggerDownloadBlob(zipBlob, 'village_ai_package_v6.zip');
    } finally {
      exportZipBtn.textContent = t().exportZip;
      updateUI();
    }
  };

  exportJsonBtn.onclick = () => {
    if (!img) return;
    const includePhotos = embedJsonPhotosIn.checked;
    const payload = buildProjectPayload(includePhotos);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    triggerDownloadBlob(blob, includePhotos ? 'village_ai_bundle_v6.json' : 'village_survey_v6_light.json');
  };

  // --- Import Project JSON (supports v1–v6, restoring GCPs & photo bearings) ---
  importJsonIn.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data.points) && data.points.length >= 3) {
          points = data.points.map(p => ({ x: Number(p.x), y: Number(p.y) }));
          closed = (typeof data.boundaryClosed === 'boolean') ? data.boundaryClosed : true;
        }
        const gCols = (data.grid && data.grid.cols) || data.cols;
        const gRows = (data.grid && data.grid.rows) || data.rows;
        const gAligned = (data.grid && typeof data.grid.aligned === 'boolean') ? data.grid.aligned : data.aligned;
        if (gCols) colsIn.value = clamp(parseInt(gCols, 10), 2, 20);
        if (gRows) rowsIn.value = clamp(parseInt(gRows, 10), 2, 20);
        if (typeof gAligned === 'boolean') alignIn.checked = gAligned;

        if (data.georeferencing && Array.isArray(data.georeferencing.gcps)) {
          gcps = data.georeferencing.gcps
            .filter(g => !isNaN(Number(g.x)) && !isNaN(Number(g.y)) && !isNaN(Number(g.lat)) && !isNaN(Number(g.lon)))
            .map(g => ({ x: Number(g.x), y: Number(g.y), lat: Number(g.lat), lon: Number(g.lon), label: g.label || '' }));
          recomputeGeorefModel();
        }
        if (typeof data.metersPerPixel === 'number' && data.metersPerPixel > 0) {
          metersPerPixel = data.metersPerPixel;
        }
        if (Array.isArray(data.features)) {
          features = data.features
            .filter(item => {
              if (!Array.isArray(item.points)) return false;
              const isPin = (item.geometry === 'point' || item.points.length === 1);
              return isPin ? item.points.length >= 1 : item.points.length >= 3;
            })
            .map((item, idx) => {
              const isPin = (item.geometry === 'point' || item.points.length === 1);
              const restoredPhotos = Array.isArray(item.photos)
                ? item.photos
                    .filter(ph => ph && typeof ph.dataUrl === 'string' && ph.dataUrl.startsWith('data:image/'))
                    .map(ph => {
                      const approxBytes = Math.round((ph.dataUrl.length - ph.dataUrl.indexOf(',') - 1) * 0.75);
                      return {
                        origName: ph.origName || ph.file || 'photo.jpg',
                        dataUrl: ph.dataUrl,
                        width: Number(ph.width) || 0,
                        height: Number(ph.height) || 0,
                        sizeKB: Math.max(1, Math.round(approxBytes / 1024)),
                        bearing: ph.cameraBearing || ph.bearing || ''
                      };
                    })
                : [];
              return {
                id: item.id || formatId(idx + 1),
                geometry: isPin ? 'point' : 'polygon',
                type: TYPE_STYLES[item.type] ? item.type : 'ADD',
                name: item.name || '',
                photoRef: item.photoRef || '',
                photos: restoredPhotos,
                notes: item.notes || '',
                removeNotes: item.removeNotes || '',
                addNotes: item.addNotes || '',
                points: (isPin ? item.points.slice(0, 1) : item.points).map(p => ({ x: Number(p.x), y: Number(p.y) }))
              };
            });
          let maxN = features.length;
          for (const item of features) {
            const m = /^ID-(\d+)$/.exec(item.id);
            if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
          }
          nextFeatNum = maxN + 1;
        }
        draftPoints = [];
        editSavedVertices = false;
        renderFeaturesList();
        updateUI();
        renderView();
        scheduleAutoSave(true);
      } catch {
        alert(t().alertBadJson);
      }
      importJsonIn.value = '';
    };
    reader.readAsText(f);
  };

  resizeCanvas();
  applyLanguage();
  restoreAutoSaveOnBoot();
})();
</script>
