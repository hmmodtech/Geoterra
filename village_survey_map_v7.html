<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أداة مسح القرية (حفظ تلقائي + شاشة كاملة + GPS) — Village Survey Pro v7</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #080f1d;
    --panel: #101a2e;
    --panel2: #0c1526;
    --border: #1e3354;
    --cyan: #38bdf8;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --purple: #a855f7;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: monospace, Tahoma, Arial, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 20;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
    justify-content: center;
  }
  button, label.file-btn {
    padding: 6px 9px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #16233d;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  label.file-btn {
    border-color: var(--cyan);
    background: #0c2742;
    color: #e0f2fe;
    font-weight: bold;
  }
  input[type="file"] { display: none; }
  .btn-primary { background: #0284c7; border-color: var(--cyan); color: #fff; font-weight: bold; }
  .btn-green   { background: #15803d; border-color: var(--green); color: #fff; font-weight: bold; }
  .btn-amber   { background: #92400e; border-color: var(--amber); color: #fff; font-weight: bold; }
  .btn-purple  { background: #6b21a8; border-color: #c084fc; color: #fff; font-weight: bold; }
  .btn-danger  { background: #7f1d1d; border-color: var(--red); color: #fff; }
  .btn-lang    { background: #0f172a; border-color: var(--cyan); color: var(--cyan); font-weight: bold; }
  .btn-active  { background: #0369a1; border-color: #7dd3fc; box-shadow: 0 0 0 1px #38bdf8 inset; color: #fff; font-weight: bold; }
  .btn-active-green { background: #166534; border-color: #4ade80; box-shadow: 0 0 0 1px #22c55e inset; color: #fff; font-weight: bold; }
  .btn-active-amber { background: #92400e; border-color: #fbbf24; box-shadow: 0 0 0 1px #f59e0b inset; color: #fff; font-weight: bold; }
  .btn-active-purple { background: #581c87; border-color: #c084fc; box-shadow: 0 0 0 1px #a855f7 inset; color: #fff; font-weight: bold; }
  .btn-gps-on  { background: #0c4a6e; border-color: #22d3ee; color: #67e8f9; box-shadow: 0 0 8px rgba(34,211,238,0.35); font-weight: bold; }

  .badge {
    background: #080f1d;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    border-radius: 10px;
    padding: 0 6px;
    font-size: 11px;
    font-weight: bold;
  }

  .sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 2px;
  }

  .drawer {
    display: none;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
    z-index: 19;
    max-height: 52vh;
    overflow-y: auto;
  }
  .drawer.open { display: block; }

  .ctrl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    background: #080f1d;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .ctrl input[type="number"] {
    width: 46px;
    padding: 3px 4px;
    background: #101a2e;
    border: 1px solid var(--cyan);
    border-radius: 4px;
    color: #fff;
    font-family: inherit;
    text-align: center;
    font-size: 12px;
  }

  .section-box {
    border: 1px solid var(--border);
    background: rgba(16, 26, 46, 0.55);
    border-radius: 8px;
    padding: 7px 8px;
    margin-bottom: 7px;
  }
  .section-box.gps-box {
    border-color: #0369a1;
    background: rgba(12, 74, 110, 0.18);
  }
  .section-box.ai-box {
    border-color: #4c1d95;
    background: rgba(88, 28, 135, 0.14);
  }
  .section-title {
    font-size: 11.5px;
    font-weight: bold;
    margin-bottom: 6px;
    text-align: center;
  }
  .section-title.cyan { color: #7dd3fc; }
  .section-title.purp { color: #d8b4fe; }

  .status {
    background: #0b1426;
    border-bottom: 1px solid var(--border);
    padding: 5px 10px;
    font-size: 11.5px;
    color: var(--cyan);
    text-align: center;
    line-height: 1.45;
  }
  .status .warn { color: var(--amber); }
  .status .ok   { color: var(--green); }
  .status .purp { color: #d8b4fe; }
  .status .err  { color: #f87171; }

  .stage {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #050a14;
    touch-action: none;
  }
  #viewCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* Zoom buttons */
  .zoom-fab {
    position: absolute;
    left: 10px;
    bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 6;
  }
  .zoom-fab button {
    width: 38px;
    height: 38px;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    background: rgba(16, 26, 46, 0.92);
    border-color: var(--cyan);
    padding: 0;
  }

  /* Live Compass & GPS Floating HUD */
  .nav-hud {
    position: absolute;
    right: 10px;
    bottom: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 6;
    pointer-events: auto;
  }
  .compass-widget {
    width: 78px;
    background: rgba(8, 15, 29, 0.9);
    border: 1.5px solid var(--cyan);
    border-radius: 10px;
    padding: 5px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
    cursor: pointer;
    user-select: none;
  }
  .compass-widget.inactive {
    border-color: #334155;
    opacity: 0.78;
  }
  .compass-svg {
    width: 56px;
    height: 56px;
    display: block;
    margin: 0 auto;
  }
  .compass-readout {
    font-size: 10.5px;
    font-weight: bold;
    color: var(--cyan);
    margin-top: 2px;
    direction: ltr;
  }
  .gps-pill {
    background: rgba(8, 15, 29, 0.92);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 4px 7px;
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
    max-width: 155px;
    line-height: 1.35;
    direction: ltr;
  }
  .gps-pill.good { border-color: var(--green); color: #86efac; }
  .gps-pill.warn { border-color: var(--amber); color: #fde68a; }
  .gps-pill.err  { border-color: var(--red);   color: #fca5a5; }

  /* Toast */
  .toast {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(8, 15, 29, 0.94);
    border: 1px solid var(--cyan);
    color: #e0f2fe;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 30;
    display: none;
    max-width: 92%;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }
  .toast.show { display: block; }

  /* Features list */
  .feat-empty {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 10px 4px;
  }
  .feat-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    background: #101a2e;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    margin-bottom: 6px;
    text-align: start;
  }
  .feat-info { flex: 1; min-width: 0; }
  .feat-title {
    font-size: 12.5px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: bold;
  }
  .tag-REM { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid #ef4444; }
  .tag-REP { background: rgba(168,85,247,0.22); color: #d8b4fe; border: 1px solid #a855f7; }
  .tag-MOD { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid #f59e0b; }
  .tag-ADD { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid #22c55e; }
  .tag-geom { background: rgba(56,189,248,0.16); color: #7dd3fc; border: 1px solid #0284c7; }
  .tag-photo { background: rgba(148,163,184,0.16); color: #cbd5e1; border: 1px solid #475569; }
  .feat-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    word-break: break-word;
    line-height: 1.45;
  }
  .feat-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .feat-thumb-img {
    width: 46px;
    height: 46px;
    object-fit: cover;
    border-radius: 5px;
    border: 1px solid var(--cyan);
    cursor: pointer;
    background: #080f1d;
  }
  .feat-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .feat-actions button { padding: 5px 8px; font-size: 12px; }

  /* Modals */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 15, 0.84);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%;
    max-width: 460px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--cyan);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
  }
  .modal h3 {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: var(--cyan);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .field { margin-bottom: 10px; text-align: start; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input[type="text"], .field input[type="number"], .field textarea, .field select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #080f1d;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
  }
  .field textarea { min-height: 52px; resize: vertical; }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .photo-row { display: flex; gap: 6px; align-items: stretch; }
  .photo-row input[type="text"] { flex: 1; min-width: 0; }
  .photo-pick-btn {
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--cyan);
    background: #0c2742;
    color: #e0f2fe;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .photo-hint { font-size: 10.5px; color: #7dd3fc; margin-top: 4px; }
  .modal-thumb-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 7px;
  }
  .thumb-card {
    position: relative;
    width: 102px;
    background: #080f1d;
    border: 1px solid var(--cyan);
    border-radius: 6px;
    padding: 4px;
    text-align: center;
  }
  .thumb-card img {
    width: 100%;
    height: 60px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
    cursor: pointer;
  }
  .thumb-cap {
    font-size: 9.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .thumb-dir-row {
    display: flex;
    gap: 3px;
    margin-top: 4px;
    align-items: center;
  }
  .thumb-dir-sel {
    flex: 1;
    min-width: 0;
    padding: 2px 3px !important;
    font-size: 10.5px !important;
    background: #101a2e !important;
    border: 1px solid #334155 !important;
    color: #7dd3fc !important;
    border-radius: 4px !important;
  }
  .thumb-dir-btn {
    padding: 2px 5px;
    font-size: 11px;
    background: #0c2742;
    border-color: var(--cyan);
  }
  .thumb-del {
    position: absolute;
    top: -6px;
    left: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #dc2626;
    border: 1.5px solid #fff;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    padding: 0;
    justify-content: center;
    line-height: 1;
  }
  .type-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .type-btn { justify-content: center; padding: 8px 6px; font-size: 12px; border-width: 1.5px; }
  .type-btn.sel-ADD { background: rgba(34,197,94,0.25); border-color: #22c55e; color: #86efac; font-weight: bold; }
  .type-btn.sel-REP { background: rgba(168,85,247,0.28); border-color: #a855f7; color: #e9d5ff; font-weight: bold; }
  .type-btn.sel-MOD { background: rgba(245,158,11,0.25); border-color: #f59e0b; color: #fde68a; font-weight: bold; }
  .type-btn.sel-REM { background: rgba(239,68,68,0.25); border-color: #ef4444; color: #fca5a5; font-weight: bold; }
  .modal-stats {
    font-size: 11.5px;
    color: var(--cyan);
    background: #080f1d;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 10px;
    text-align: start;
  }
  .rep-box {
    border: 1px dashed var(--purple);
    border-radius: 8px;
    padding: 8px;
    background: rgba(168, 85, 247, 0.08);
    margin-bottom: 10px;
  }
  .modal-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 15, 0.92);
    z-index: 80;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    cursor: pointer;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 96vw;
    max-height: 82vh;
    border: 2px solid var(--cyan);
    border-radius: 8px;
    object-fit: contain;
  }
  .lightbox-cap { margin-top: 10px; color: var(--cyan); font-size: 13px; text-align: center; }

  /* Clean Survey Mode (Hide UI / Full Canvas) */
  body.clean-mode .toolbar,
  body.clean-mode .drawer,
  body.clean-mode .status {
    display: none !important;
  }
  body.clean-mode.hide-hud .zoom-fab,
  body.clean-mode.hide-hud .nav-hud {
    display: none !important;
  }
  .clean-hud {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 26;
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    background: rgba(8, 15, 29, 0.88);
    border: 1.5px solid var(--cyan);
    border-radius: 10px;
    padding: 5px 7px;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.6);
    max-width: calc(100% - 20px);
    backdrop-filter: blur(4px);
  }
  body.clean-mode .clean-hud {
    display: flex;
  }
  .clean-hud button {
    padding: 5px 8px;
    font-size: 12px;
  }
  .autosave-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #86efac;
    background: rgba(21, 128, 61, 0.18);
    border: 1px solid rgba(34, 197, 94, 0.45);
    border-radius: 999px;
    padding: 1px 8px;
    margin-inline-start: 6px;
  }
  .section-box.save-box {
    border-color: #15803d;
    background: rgba(21, 128, 61, 0.12);
  }
</style>
</head>
<body>
<div class="app">
  <!-- Main Toolbar -->
  <div class="toolbar">
    <!-- Row 1 -->
    <div class="row">
      <label class="file-btn">📂 <span id="lblLoadImg">صورة</span><input type="file" id="fileIn" accept="image/*"></label>
      <button id="modeBoundaryBtn" class="btn-active" disabled></button>
      <button id="modeFeatureBtn" disabled></button>
      <button id="modePanBtn" disabled></button>
      <button id="toggleListBtn" disabled><span id="lblListBtn"></span> <span class="badge" id="featCountBadge">0</span></button>
      <button id="toggleSettingsBtn" disabled></button>
      <button id="compassToggleBtn" title="Compass">🧭</button>
      <button id="gpsToggleBtn" title="GPS">🛰️</button>
      <button id="cleanModeBtn" disabled>👁️‍🗨️</button>
      <button id="fullscreenBtn">⛶</button>
      <button id="langToggleBtn" class="btn-lang" title="Switch Language">EN</button>
    </div>

    <!-- Row 2: Contextual actions -->
    <div class="row" id="contextRow">
      <!-- Boundary controls -->
      <button id="closePolyBtn" class="btn-green" disabled></button>
      <button id="undoBoundaryBtn" disabled></button>
      <button id="clearBoundaryBtn" class="btn-danger" disabled></button>

      <!-- Feature controls -->
      <button id="geomPolyBtn" style="display:none" disabled></button>
      <button id="geomPinBtn" style="display:none" disabled></button>
      <span class="sep" id="featSep" style="display:none"></span>
      <button id="finishFeatBtn" class="btn-green" style="display:none" disabled></button>
      <button id="undoFeatBtn" style="display:none" disabled></button>
      <button id="cancelFeatBtn" class="btn-danger" style="display:none" disabled></button>
      <button id="toggleEditSavedBtn" style="display:none" disabled></button>

      <!-- Shared GPS Drop Vertex Button (shown in Boundary & Feature modes) -->
      <button id="dropGpsPtBtn" class="btn-primary" style="display:none" disabled></button>

      <!-- Scale calibration controls -->
      <button id="cancelScaleBtn" class="btn-danger" style="display:none"></button>

      <!-- Georeferencing GCP controls -->
      <button id="doneGeorefBtn" class="btn-green" style="display:none"></button>
      <button id="undoGcpBtn" style="display:none" disabled></button>
      <button id="clearGcpBtn" class="btn-danger" style="display:none" disabled></button>
    </div>
  </div>

  <!-- Settings & Export Drawer -->
  <div class="drawer" id="settingsDrawer">
    <!-- Grid controls -->
    <div class="section-box">
      <div class="row" style="margin-bottom:6px;">
        <span class="ctrl"><span id="lblCols"></span> <input type="number" id="colsIn" value="6" min="2" max="20"></span>
        <span class="ctrl"><span id="lblRows"></span> <input type="number" id="rowsIn" value="4" min="2" max="20"></span>
        <label class="ctrl"><input type="checkbox" id="alignIn" checked> <span id="lblAlign"></span></label>
        <label class="ctrl"><input type="checkbox" id="dimIn" checked> <span id="lblDim"></span></label>
        <label class="ctrl"><input type="checkbox" id="subIn"> <span id="lblSub"></span></label>
        <label class="ctrl"><input type="checkbox" id="showGridIn" checked> <span id="lblShowGrid"></span></label>
      </div>
      <div class="row">
        <span id="lblLayersTitle" style="font-size:11.5px; color:#94a3b8;"></span>
        <label class="ctrl"><input type="checkbox" id="filtRemIn" checked> <span id="lblFiltRem"></span></label>
        <label class="ctrl"><input type="checkbox" id="filtRepIn" checked> <span id="lblFiltRep"></span></label>
        <label class="ctrl"><input type="checkbox" id="filtModIn" checked> <span id="lblFiltMod"></span></label>
        <label class="ctrl"><input type="checkbox" id="filtAddIn" checked> <span id="lblFiltAdd"></span></label>
        <label class="ctrl"><input type="checkbox" id="filtPinIn" checked> <span id="lblFiltPin"></span></label>
        <label class="ctrl"><input type="checkbox" id="showGcpIn" checked> <span id="lblShowGcp"></span></label>
      </div>
    </div>

    <!-- GPS Georeferencing & Scale Box -->
    <div class="section-box gps-box">
      <div class="section-title cyan" id="lblGpsSectionTitle"></div>
      <div class="row" style="margin-bottom:6px;">
        <button id="modeGeorefBtn" class="btn-primary" disabled></button>
        <button id="manualCoordPtBtn" class="btn-amber" disabled></button>
        <button id="modeScaleBtn" disabled></button>
      </div>
      <div class="row">
        <span class="ctrl" id="georefInfoLbl"></span>
        <span class="ctrl" id="scaleInfoLbl"></span>
      </div>
    </div>

    <!-- Auto-Save Session Box -->
    <div class="section-box save-box">
      <div class="section-title" style="color:#86efac;" id="lblAutosaveSectionTitle"></div>
      <div class="row">

  function showToast(msg, duration = 3400) {

  // --- Local Auto-Save Engine (IndexedDB primary + localStorage lite fallback) ---
  const IDB_NAME = 'VillageSurveyAutoSaveDB';
  const IDB_STORE = 'sessions';
  const IDB_KEY = 'active';
  const LS_LITE_KEY = 'village_survey_autosave_lite_v7';

  function openAutoSaveDB() {
    return new Promise((resolve, reject) => {
      if (typeof indexedDB === 'undefined') { reject(new Error('No IDB')); return; }
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('IDB open error'));
      } catch (err) {
        reject(err);
      }
    });
  }

  async function idbPutRecord(record) {
    const db = await openAutoSaveDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(record);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error || new Error('IDB put error')); };
    });
  }

  async function idbGetRecord() {
    const db = await openAutoSaveDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => { db.close(); resolve(req.result || null); };
      req.onerror = () => { db.close(); reject(req.error || new Error('IDB get error')); };
    });
  }

  async function idbDeleteRecord() {
    const db = await openAutoSaveDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error || new Error('IDB delete error')); };
    });
  }

  function buildSessionSnapshot(includePhotoData) {
    return {
      version: 7,
      savedAt: Date.now(),
      baseImageName: baseImageName || '',
      points: points.map(p => ({ x: p.x, y: p.y })),
      closed,
      features: features.map(f => ({
        id: f.id,
        geometry: f.geometry,
        type: f.type,
        name: f.name || '',
        photoRef: f.photoRef || '',
        photos: includePhotoData ? (f.photos || []).map(ph => ({ ...ph })) : [],
        notes: f.notes || '',
        removeNotes: f.removeNotes || '',
        addNotes: f.addNotes || '',
        points: f.points.map(p => ({ x: p.x, y: p.y }))
      })),
      nextFeatNum,
      gcps: gcps.map(g => ({ x: g.x, y: g.y, lat: g.lat, lon: g.lon, label: g.label || '' })),
      metersPerPixel,
      grid: {
        cols: parseInt(colsIn.value, 10) || 6,
        rows: parseInt(rowsIn.value, 10) || 4,
        aligned: alignIn.checked,
        dim: dimIn.checked,
        sub: subIn.checked,
        showGrid: showGridIn.checked
      },
      filters: {
        rem: filtRemIn.checked,
        rep: filtRepIn.checked,
        mod: filtModIn.checked,
        add: filtAddIn.checked,
        pin: filtPinIn.checked,
        gcp: showGcpIn.checked
      },
      mode: (mode === 'scale') ? 'feature' : mode,
      featGeom
    };
  }

  function formatNowTime() {
    const d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, '0')).join(':');
  }

  function updateAutosaveLabel() {

    if (lastSavedMode === 'full') {

    } else if (lastSavedMode === 'lite') {
      autosaveInfoLbl.textContent = L.autosaveLite(lastSavedTimeStr);
    } else if (lastSavedMode === 'error') {
      autosaveInfoLbl.textContent = L.autosaveFailed;
    } else {

  async function performAutoSaveNow() {
    if (!img && points.length === 0 && features.length === 0 && gcps.length === 0) return;
    const fullState = buildSessionSnapshot(true);
    const timeStr = formatNowTime();

    // Always write lightweight fallback to localStorage (without imageBlob & without heavy Base64 photos)
    let lsOk = false;
    try {
      const liteState = buildSessionSnapshot(false);
      localStorage.setItem(LS_LITE_KEY, JSON.stringify(liteState));
      lsOk = true;
    } catch {}

    // Primary full persistence in IndexedDB (stores base map Blob + all attached photos)
    try {
      await idbPutRecord({
        id: IDB_KEY,
        state: fullState,
        imageBlob: baseImageBlob || null
      });
      lastSavedMode = 'full';
      lastSavedTimeStr = timeStr;
    } catch {
      lastSavedMode = lsOk ? 'lite' : 'error';
      lastSavedTimeStr = timeStr;
    }
    updateAutosaveLabel();
  }

  function scheduleAutoSave(immediate = false) {
    if (autosaveTimer) {
      clearTimeout(autosaveTimer);
      autosaveTimer = null;
    }
    if (immediate) {
      performAutoSaveNow();
    } else {
      autosaveTimer = setTimeout(() => {
        autosaveTimer = null;
        performAutoSaveNow();
      }, 350);
    }
  }

  function applyRestoredStateData(state) {
    if (!state || typeof state !== 'object') return false;
    if (Array.isArray(state.points)) {
      points = state.points.map(p => ({ x: Number(p.x), y: Number(p.y) }));
      closed = !!state.closed && points.length >= 3;
    }
    if (Array.isArray(state.gcps)) {
      gcps = state.gcps
        .filter(g => !isNaN(Number(g.x)) && !isNaN(Number(g.y)) && !isNaN(Number(g.lat)) && !isNaN(Number(g.lon)))
        .map(g => ({ x: Number(g.x), y: Number(g.y), lat: Number(g.lat), lon: Number(g.lon), label: g.label || '' }));
      recomputeGeorefModel();
    }
    if (typeof state.metersPerPixel === 'number' && state.metersPerPixel > 0) {
      metersPerPixel = state.metersPerPixel;
    }
    if (Array.isArray(state.features)) {
      features = state.features
        .filter(item => Array.isArray(item.points) && item.points.length >= 1)
        .map((item, idx) => ({
          id: item.id || formatId(idx + 1),
          geometry: (item.geometry === 'point' || item.points.length === 1) ? 'point' : 'polygon',
          type: TYPE_STYLES[item.type] ? item.type : 'ADD',
          name: item.name || '',
          photoRef: item.photoRef || '',
          photos: Array.isArray(item.photos) ? item.photos : [],
          notes: item.notes || '',
          removeNotes: item.removeNotes || '',
          addNotes: item.addNotes || '',
          points: item.points.map(p => ({ x: Number(p.x), y: Number(p.y) }))
        }));
    }
    if (typeof state.nextFeatNum === 'number' && state.nextFeatNum >= 1) {
      nextFeatNum = state.nextFeatNum;
    } else {
      let maxN = features.length;
      for (const item of features) {
        const m = /^ID-(\d+)$/.exec(item.id);
        if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
      }
      nextFeatNum = maxN + 1;
    }
    if (state.grid) {
      if (state.grid.cols) colsIn.value = clamp(parseInt(state.grid.cols, 10), 2, 20);
      if (state.grid.rows) rowsIn.value = clamp(parseInt(state.grid.rows, 10), 2, 20);
      if (typeof state.grid.aligned === 'boolean') alignIn.checked = state.grid.aligned;
      if (typeof state.grid.dim === 'boolean') dimIn.checked = state.grid.dim;
      if (typeof state.grid.sub === 'boolean') subIn.checked = state.grid.sub;
      if (typeof state.grid.showGrid === 'boolean') showGridIn.checked = state.grid.showGrid;
    }
    if (state.filters) {
      if (typeof state.filters.rem === 'boolean') filtRemIn.checked = state.filters.rem;
      if (typeof state.filters.rep === 'boolean') filtRepIn.checked = state.filters.rep;
      if (typeof state.filters.mod === 'boolean') filtModIn.checked = state.filters.mod;
      if (typeof state.filters.add === 'boolean') filtAddIn.checked = state.filters.add;
      if (typeof state.filters.pin === 'boolean') filtPinIn.checked = state.filters.pin;
      if (typeof state.filters.gcp === 'boolean') showGcpIn.checked = state.filters.gcp;
    }
    if (state.mode && ['boundary', 'feature', 'pan', 'georef'].includes(state.mode)) {
      mode = state.mode;
    }
    if (state.featGeom === 'point' || state.featGeom === 'polygon') {
      featGeom = state.featGeom;
    }
    baseImageName = state.baseImageName || '';
    return true;
  }

  async function restoreAutoSaveOnBoot() {
    let rec = null;
    try {
      rec = await idbGetRecord();
    } catch {}

    if (rec && rec.state) {
      const hasData = (rec.imageBlob != null) ||
        (rec.state.points && rec.state.points.length > 0) ||
        (rec.state.features && rec.state.features.length > 0) ||
        (rec.state.gcps && rec.state.gcps.length > 0);
      if (!hasData) return;

      applyRestoredStateData(rec.state);
      const d = rec.state.savedAt ? new Date(rec.state.savedAt) : new Date();
      lastSavedTimeStr = [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, '0')).join(':');
      lastSavedMode = 'full';

      if (rec.imageBlob instanceof Blob) {
        baseImageBlob = rec.imageBlob;
        if (baseImageObjectUrl) URL.revokeObjectURL(baseImageObjectUrl);
        baseImageObjectUrl = URL.createObjectURL(rec.imageBlob);
        const loaded = new Image();
        loaded.onload = () => {
          img = loaded;
          pendingRestoredMeta = false;
          resizeCanvas();
          fitImage();
          renderFeaturesList();
          updateUI();
          updateAutosaveLabel();
          showToast(t().toastRestoredFull(features.length, gcps.length), 4200);
        };
        loaded.src = baseImageObjectUrl;
      } else {
        pendingRestoredMeta = true;
        renderFeaturesList();
        updateUI();
        updateAutosaveLabel();
        showToast(t().toastRestoredMeta(features.length, gcps.length), 5000);
      }
      return;
    }

    // Fallback to localStorage lite copy
    try {
      const raw = localStorage.getItem(LS_LITE_KEY);
      if (!raw) return;
      const lite = JSON.parse(raw);
      const hasData = (lite.points && lite.points.length > 0) ||
        (lite.features && lite.features.length > 0) ||
        (lite.gcps && lite.gcps.length > 0);
      if (!hasData) return;
      applyRestoredStateData(lite);
      pendingRestoredMeta = true;
      const d = lite.savedAt ? new Date(lite.savedAt) : new Date();
      lastSavedTimeStr = [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, '0')).join(':');
      lastSavedMode = 'lite';
      renderFeaturesList();
      updateUI();
      updateAutosaveLabel();
      showToast(t().toastRestoredMeta(features.length, gcps.length), 5000);
    } catch {}
  }

  function isFeatureVisible(feat) {
    if (feat.geometry === 'point' && !filtPinIn.checked) return false;
    if (feat.type === 'REM') return filtRemIn.checked;

  // --- Verified 2D Georeferencing Solver (2pt Similarity / 3+pt Least-Squares Affine) ---
  function solve3x3(A, b) {
    const M = A.map((row, i) => [...row, b[i]]);
    for (let col = 0; col < 3; col++) {
      let piv = col;
      for (let r = col + 1; r < 3; r++) {
        if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      }
      if (Math.abs(M[piv][col]) < 1e-12) return null;
      [M[col], M[piv]] = [M[piv], M[col]];
      const div = M[col][col];
      for (let j = col; j < 4; j++) M[col][j] /= div;
      for (let r = 0; r < 3; r++) {
        if (r === col) continue;
        const f = M[r][col];
        for (let j = col; j < 4; j++) M[r][j] -= f * M[col][j];
      }
    }
    return [M[0][3], M[1][3], M[2][3]];
  }

  function recomputeGeorefModel() {
    if (gcps.length < 2) {
      georefModel = null;
      return;
    }
    const lat0 = gcps.reduce((s, g) => s + g.lat, 0) / gcps.length;
    const lon0 = gcps.reduce((s, g) => s + g.lon, 0) / gcps.length;
    const mPerDegLat = 111132.954;
    const mPerDegLon = 111319.488 * Math.cos(lat0 * Math.PI / 180);
    const pts = gcps.map(g => ({
      e: (g.lon - lon0) * mPerDegLon,
      n: (g.lat - lat0) * mPerDegLat,
      x: g.x,
      y: g.y
    }));

    if (gcps.length === 2) {
      const p0 = pts[0], p1 = pts[1];
      const du = p1.e - p0.e;
      const dv = (-p1.n) - (-p0.n);
      const dx = p1.x - p0.x;
      const dy = p1.y - p0.y;
      const den = du * du + dv * dv;
      if (den < 1e-6) { georefModel = null; return; }
      const p = (dx * du + dy * dv) / den;
      const q = (dy * du - dx * dv) / den;
      const cx = p0.x - (p * p0.e + q * p0.n);
      const cy = p0.y - (q * p0.e - p * p0.n);
      const pxPerM = Math.hypot(p, q);
      georefModel = {
        mode: 'similarity_2pt',
        lat0, lon0, mPerDegLat, mPerDegLon,
        ax: p, bx: q, cx,
        ay: q, by: -p, cy,
        metersPerPx: pxPerM > 1e-9 ? (1 / pxPerM) : null,
        rmsPx: 0
      };
      if (!metersPerPixel && georefModel.metersPerPx) metersPerPixel = georefModel.metersPerPx;
      return;
    }

    // 3+ GCPs: Least-squares 2D Affine
    const ATA = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    const ATbx = [0, 0, 0];
    const ATby = [0, 0, 0];
    for (const pt of pts) {
      const row = [pt.e, pt.n, 1];
      for (let r = 0; r < 3; r++) {
        ATbx[r] += row[r] * pt.x;
        ATby[r] += row[r] * pt.y;
        for (let c = 0; c < 3; c++) ATA[r][c] += row[r] * row[c];
      }
    }
    const wx = solve3x3(ATA, ATbx);
    const wy = solve3x3(ATA, ATby);
    if (!wx || !wy) { georefModel = null; return; }

    let sqErr = 0;
    for (const pt of pts) {
      const px = wx[0] * pt.e + wx[1] * pt.n + wx[2];
      const py = wy[0] * pt.e + wy[1] * pt.n + wy[2];
      sqErr += (px - pt.x) ** 2 + (py - pt.y) ** 2;
    }
    const rmsPx = Math.sqrt(sqErr / pts.length);
    const avgPxPerM = 0.5 * (Math.hypot(wx[0], wy[0]) + Math.hypot(wx[1], wy[1]));
    georefModel = {
      mode: 'affine_3pt',
      lat0, lon0, mPerDegLat, mPerDegLon,
      ax: wx[0], bx: wx[1], cx: wx[2],
      ay: wy[0], by: wy[1], cy: wy[2],
      metersPerPx: avgPxPerM > 1e-9 ? (1 / avgPxPerM) : null,
      rmsPx
    };
    if (georefModel.metersPerPx) metersPerPixel = georefModel.metersPerPx;
  }

  function latLonToImageXY(lat, lon) {
    if (!georefModel) return null;
    const e = (lon - georefModel.lon0) * georefModel.mPerDegLon;
    const n = (lat - georefModel.lat0) * georefModel.mPerDegLat;
    return {
      x: georefModel.ax * e + georefModel.bx * n + georefModel.cx,
      y: georefModel.ay * e + georefModel.by * n + georefModel.cy
    };
  }

  function imageXYToLatLon(x, y) {
    if (!georefModel) return null;
    const det = georefModel.ax * georefModel.by - georefModel.bx * georefModel.ay;
    if (Math.abs(det) < 1e-12) return null;
    const dx = x - georefModel.cx;
    const dy = y - georefModel.cy;
    const e = (georefModel.by * dx - georefModel.bx * dy) / det;
    const n = (-georefModel.ay * dx + georefModel.ax * dy) / det;
    return {
      lat: Number((georefModel.lat0 + n / georefModel.mPerDegLat).toFixed(7)),
      lon: Number((georefModel.lon0 + e / georefModel.mPerDegLon).toFixed(7))
    };
  }

  // --- Live Compass Sensor ---
  function handleOrientationEvent(ev) {
    let heading = null;
    if (typeof ev.webkitCompassHeading === 'number' && !isNaN(ev.webkitCompassHeading)) {
      heading = ev.webkitCompassHeading;
    } else if (typeof ev.alpha === 'number' && !isNaN(ev.alpha)) {
      // Standard Android absolute alpha is counter-clockwise from North
      heading = (360 - ev.alpha) % 360;
    }
    if (heading === null) return;
    compassGotEvent = true;
    compassHeading = ((heading % 360) + 360) % 360;
    updateCompassHud();
    if (gpsActive && georefModel) renderView();
  }

  function updateCompassHud() {
    if (!compassActive) {
      compassHud.classList.add('inactive');
      compassDialGroup.setAttribute('transform', 'rotate(0 50 50)');
      compassReadout.textContent = 'OFF';
      compassToggleBtn.className = '';
      return;
    }
    compassHud.classList.remove('inactive');
    compassToggleBtn.className = 'btn-gps-on';
    if (compassHeading === null) {
      compassReadout.textContent = '...';
      return;
    }
    const deg = Math.round(compassHeading) % 360;
    const card = degToCardinal(deg);
    // Rotate dial opposite to heading so North arrow always points toward magnetic North
    compassDialGroup.setAttribute('transform', `rotate(${(-compassHeading).toFixed(1)} 50 50)`);
    compassReadout.textContent = `${String(deg).padStart(3, '0')}° ${card}`;
  }

  async function toggleCompass() {
    if (compassActive) {
      window.removeEventListener('deviceorientationabsolute', handleOrientationEvent, true);
      window.removeEventListener('deviceorientation', handleOrientationEvent, true);
      if (compassFallbackTimer) clearTimeout(compassFallbackTimer);
      compassActive = false;
      compassHeading = null;
      compassGotEvent = false;
      updateCompassHud();
      showToast(t().toastCompassOff, 2200);
      return;
    }
    if (typeof window.DeviceOrientationEvent === 'undefined') {
      showToast(t().toastCompassNoSensor, 4500);
      return;
    }
    try {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm !== 'granted') {
          showToast(t().toastCompassNoSensor, 4500);
          return;
        }
      }
    } catch {
      showToast(t().toastCompassNoSensor, 4500);
      return;
    }
    compassActive = true;
    compassGotEvent = false;
    window.addEventListener('deviceorientationabsolute', handleOrientationEvent, true);
    window.addEventListener('deviceorientation', handleOrientationEvent, true);
    updateCompassHud();
    showToast(t().toastCompassOn, 2200);

    if (compassFallbackTimer) clearTimeout(compassFallbackTimer);
    compassFallbackTimer = setTimeout(() => {
      if (compassActive && !compassGotEvent) {
        showToast(t().toastCompassNoSensor, 4800);
      }
    }, 2500);
  }

  compassToggleBtn.onclick = toggleCompass;
  compassHud.onclick = toggleCompass;

  // --- Live GPS Tracking ---
  function updateGpsHud() {
    if (!gpsActive) {
      gpsToggleBtn.className = '';
      gpsHudPill.style.display = 'none';
      return;
    }
    gpsToggleBtn.className = 'btn-gps-on';
    gpsHudPill.style.display = 'block';
    if (!liveGps) {
      gpsHudPill.className = 'gps-pill warn';
      gpsHudPill.textContent = '🛰️ Waiting GPS...';
      return;
    }
    const acc = Math.round(liveGps.accuracy);
    gpsHudPill.className = 'gps-pill ' + (acc <= 8 ? 'good' : (acc <= 20 ? 'warn' : 'err'));
    gpsHudPill.innerHTML = `🛰️ ±${acc}m<br>${liveGps.lat.toFixed(5)}, ${liveGps.lon.toFixed(5)}`;
  }

  function startGpsWatch() {
    if (!('geolocation' in navigator)) {
      showToast(t().toastGpsError('Geolocation unsupported'), 4200);
      return;
    }
    gpsActive = true;
    updateGpsHud();
    showToast(t().toastGpsOn, 2200);
    gpsWatchId = navigator.geolocation.watchPosition(
      pos => {
        liveGps = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy || 99,
          timestamp: pos.timestamp
        };
        updateGpsHud();
        renderView();
      },
      err => {
        gpsHudPill.className = 'gps-pill err';
        gpsHudPill.textContent = `🛰️ ERR: ${err.code}`;
        showToast(t().toastGpsError(err.message || `Code ${err.code}`), 4500);
      },
      { enableHighAccuracy: true, maximumAge: 1500, timeout: 15000 }
    );
  }

  function stopGpsWatch() {
    if (gpsWatchId !== null && 'geolocation' in navigator) {
      navigator.geolocation.clearWatch(gpsWatchId);
    }
    gpsWatchId = null;
    gpsActive = false;
    liveGps = null;
    updateGpsHud();
    renderView();
    showToast(t().toastGpsOff, 2000);
  }

  // --- Drop Point by Lat/Lon onto active Boundary / Polygon / Pin ---
  function dropLatLonPoint(lat, lon, accuracyM) {
    if (!img) return false;
    if (!georefModel) {
      listDrawer.classList.remove('open');
      settingsDrawer.classList.add('open');
      showToast(t().toastNeedGeoref, 4500);
      return false;
    }
    const xy = latLonToImageXY(lat, lon);
    if (!xy) return false;
    if (xy.x < -20 || xy.x > img.naturalWidth + 20 || xy.y < -20 || xy.y > img.naturalHeight + 20) {
      showToast(t().toastGpsOutOfBounds, 4500);
      return false;
    }
    const pt = {
      x: clamp(xy.x, 0, img.naturalWidth),
      y: clamp(xy.y, 0, img.naturalHeight)
    };

    if (mode === 'boundary') {
      if (closed) closed = false;
      points.push(pt);
    } else if (mode === 'feature') {
      editSavedVertices = false;
      if (featGeom === 'point') {
        draftPoints = [pt];
        openFeatureModal(-1, 'point');
      } else {
        modalGeom = 'polygon';
        draftPoints.push(pt);
      }
    } else {
      // Switch to feature mode and drop point
      mode = 'feature';
      featGeom = 'polygon';
      modalGeom = 'polygon';
      draftPoints.push(pt);
    }

    // Pan smoothly to show the newly added GPS point
    const rect = stage.getBoundingClientRect();
    panX = rect.width / 2 - pt.x * zoom;
    panY = rect.height / 2 - pt.y * zoom;

    updateUI();
    renderView();
    scheduleAutoSave();
    if (typeof accuracyM === 'number') {
      showToast(t().toastGpsDropped(Math.round(accuracyM)), 3400);
    }
    return true;
  }

  dropGpsPtBtn.onclick = () => {

    }

  // --- Photo compression helper ---
  function compressImageFile(file, maxEdge = 1024, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('File read failed'));
      reader.onload = ev => {
        const im = new Image();
        im.onerror = () => reject(new Error('Image decode failed'));
        im.onload = () => {
          let w = im.naturalWidth;
          let h = im.naturalHeight;
          const longest = Math.max(w, h);
          if (longest > maxEdge) {
            const sc = maxEdge / longest;
            w = Math.max(1, Math.round(w * sc));
            h = Math.max(1, Math.round(h * sc));
          }
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const cx = c.getContext('2d');
          cx.fillStyle = '#000000';
          cx.fillRect(0, 0, w, h);
          cx.drawImage(im, 0, 0, w, h);
          const dataUrl = c.toDataURL('image/jpeg', quality);
          const approxBytes = Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75);
          // Auto-tag live compass bearing if active
          let initBearing = '';
          if (compassActive && compassHeading !== null) {
            const d = Math.round(compassHeading) % 360;
            initBearing = `${d}° ${degToCardinal(d)}`;
          }
          resolve({
            origName: file.name || 'photo.jpg',
            dataUrl,
            width: w,
            height: h,
            sizeKB: Math.max(1, Math.round(approxBytes / 1024)),
            bearing: initBearing
          });
        };
        im.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function sanitizeFilename(name) {
    const base = (name || 'photo').replace(/\.[^.]+$/, '');
    const clean = base.replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
    return clean || 'photo';
  }

  function buildPhotoExportPath(featId, photoIdx, origName) {
    return `photos/${featId}_${photoIdx + 1}_${sanitizeFilename(origName)}.jpg`;
  }

  function dataUrlToUint8Array(dataUrl) {
    const idx = dataUrl.indexOf(',');
    const b64 = idx >= 0 ? dataUrl.slice(idx + 1) : dataUrl;
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function canvasToPngUint8Array(canvas) {
    return new Promise(resolve => {
      canvas.toBlob(blob => {
        if (!blob) { resolve(null); return; }
        const r = new FileReader();
        r.onload = () => resolve(new Uint8Array(r.result));
        r.readAsArrayBuffer(blob);
      }, 'image/png');
    });
  }

  function loadImageFromUrl(url) {
    return new Promise(resolve => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = url;
    });
  }

  // --- Zero-dependency Pure-JS STORE ZIP Builder ---
  const CRC_TABLE = (() => {
    const tbl = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      tbl[i] = c >>> 0;
    }
    return tbl;
  })();

  function crc32Bytes(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) {
      c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZipBlob(entries) {
    const enc = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    for (const entry of entries) {
      const nameBytes = enc.encode(entry.name);
      const data = (entry.data instanceof Uint8Array) ? entry.data : enc.encode(String(entry.data));
      const crc = crc32Bytes(data);
      const size = data.length;

      const lh = new ArrayBuffer(30);
      const lv = new DataView(lh);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localParts.push(new Uint8Array(lh), nameBytes, data);

      const ch = new ArrayBuffer(46);
      const cv = new DataView(ch);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centralParts.push(new Uint8Array(ch), nameBytes);

      offset += 30 + nameBytes.length + size;
    }

    let cdSize = 0;
    for (const part of centralParts) cdSize += part.length;

    const eocd = new ArrayBuffer(22);
    const ev = new DataView(eocd);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(eocd)], { type: 'application/zip' });
  }

  function triggerDownloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  // --- Canvas sizing & transforms ---
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = stage.getBoundingClientRect();
    viewCanvas.width = Math.max(1, Math.round(rect.width * dpr));
    viewCanvas.height = Math.max(1, Math.round(rect.height * dpr));
    vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderView();
  }
  window.addEventListener('resize', resizeCanvas);

  function fitImage() {
    if (!img) return;
    const rect = stage.getBoundingClientRect();
    const scaleX = rect.width / img.naturalWidth;
    const scaleY = rect.height / img.naturalHeight;
    zoom = Math.min(scaleX, scaleY) * 0.96;
    panX = (rect.width - img.naturalWidth * zoom) / 2;
    panY = (rect.height - img.naturalHeight * zoom) / 2;
    renderView();
  }

  function centerOnFeature(feat) {
    if (!img || !feat || !feat.points || !feat.points.length) return;
    const rect = stage.getBoundingClientRect();
    if (feat.geometry === 'point' || feat.points.length === 1) {
      const p = feat.points[0];
      zoom = clamp(Math.max(zoom, 2.2), 0.6, 8);
      panX = rect.width / 2 - p.x * zoom;
      panY = rect.height / 2 - p.y * zoom;
      renderView();
      return;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of feat.points) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
    const pw = Math.max(40, maxX - minX);
    const ph = Math.max(40, maxY - minY);
    zoom = clamp(Math.min(rect.width / (pw * 2.4), rect.height / (ph * 2.4)), 0.4, 8);
    panX = rect.width / 2 - ((minX + maxX) / 2) * zoom;
    panY = rect.height / 2 - ((minY + maxY) / 2) * zoom;
    renderView();
  }

  function screenToImage(sx, sy) {
    return { x: (sx - panX) / zoom, y: (sy - panY) / zoom };
  }

  function imageToScreen(ix, iy) {
    return { x: ix * zoom + panX, y: iy * zoom + panY };
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function zoomAt(factor, cx, cy) {
    if (!img) return;
    const newZoom = clamp(zoom * factor, 0.15, 14);
    const ratio = newZoom / zoom;
    panX = cx - (cx - panX) * ratio;
    panY = cy - (cy - panY) * ratio;
    zoom = newZoom;
    renderView();
  }

  // --- Geometry helpers ---
  function normalizeAngle(theta) {
    const halfPi = Math.PI / 2;
    while (theta <= -Math.PI / 4) theta += halfPi;
    while (theta > Math.PI / 4) theta -= halfPi;
    return theta;
  }

  function clipHalfPlane(poly, isInside, intersect) {
    if (!poly.length) return [];
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const curr = poly[i];
      const prev = poly[(i + poly.length - 1) % poly.length];
      const cIn = isInside(curr);
      const pIn = isInside(prev);
      if (cIn) {
        if (!pIn) out.push(intersect(prev, curr));
        out.push(curr);
      } else if (pIn) {
        out.push(intersect(prev, curr));
      }
    }
    return out;
  }

  function clipPolyToRect(uvPoly, u0, u1, v0, v1) {
    let p = uvPoly;
    p = clipHalfPlane(p, a => a.u >= u0, (a, b) => {
      const du = b.u - a.u;
      const t = Math.abs(du) < 1e-12 ? 0 : (u0 - a.u) / du;
      return { u: u0, v: a.v + (b.v - a.v) * t };
    });
    p = clipHalfPlane(p, a => a.u <= u1, (a, b) => {
      const du = b.u - a.u;
      const t = Math.abs(du) < 1e-12 ? 0 : (u1 - a.u) / du;
      return { u: u1, v: a.v + (b.v - a.v) * t };
    });
    p = clipHalfPlane(p, a => a.v >= v0, (a, b) => {
      const dv = b.v - a.v;
      const t = Math.abs(dv) < 1e-12 ? 0 : (v0 - a.v) / dv;
      return { u: a.u + (b.u - a.u) * t, v: v0 };
    });
    p = clipHalfPlane(p, a => a.v <= v1, (a, b) => {
      const dv = b.v - a.v;
      const t = Math.abs(dv) < 1e-12 ? 0 : (v1 - a.v) / dv;
      return { u: a.u + (b.u - a.u) * t, v: v1 };
    });
    return p;
  }

  function polyAreaCentroidUV(poly) {
    if (poly.length < 3) return { area: 0, u: 0, v: 0 };
    let a = 0, cu = 0, cv = 0;
    for (let i = 0; i < poly.length; i++) {
      const p0 = poly[i];
      const p1 = poly[(i + 1) % poly.length];
      const cross = p0.u * p1.v - p1.u * p0.v;
      a += cross;
      cu += (p0.u + p1.u) * cross;
      cv += (p0.v + p1.v) * cross;
    }
    a *= 0.5;
    if (Math.abs(a) < 1e-6) return { area: 0, u: 0, v: 0 };
    return { area: Math.abs(a), u: cu / (6 * a), v: cv / (6 * a) };
  }

  function polyAreaCentroidXY(pts) {
    if (!pts || pts.length === 0) return { areaPx: 0, cx: 0, cy: 0, perimeterPx: 0 };
    if (pts.length === 1) return { areaPx: 0, cx: pts[0].x, cy: pts[0].y, perimeterPx: 0 };
    if (pts.length < 3) {
      const sx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
      const sy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
      return { areaPx: 0, cx: sx, cy: sy, perimeterPx: 0 };
    }
    let a = 0, cx = 0, cy = 0, perim = 0;
    for (let i = 0; i < pts.length; i++) {
      const p0 = pts[i];
      const p1 = pts[(i + 1) % pts.length];
      const cross = p0.x * p1.y - p1.x * p0.y;
      a += cross;
      cx += (p0.x + p1.x) * cross;
      cy += (p0.y + p1.y) * cross;
      perim += Math.hypot(p1.x - p0.x, p1.y - p0.y);
    }
    a *= 0.5;
    if (Math.abs(a) < 1e-6) {
      const sx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
      const sy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
      return { areaPx: 0, cx: sx, cy: sy, perimeterPx: perim };
    }
    return { areaPx: Math.abs(a), cx: cx / (6 * a), cy: cy / (6 * a), perimeterPx: perim };
  }

  function colLabel(idx) {
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if (idx < 26) return letters[idx];
    return letters[Math.floor(idx / 26) - 1] + letters[idx % 26];
  }

  function computeGridModel() {
    if (!closed || points.length < 3) return null;
    const cols = clamp(parseInt(colsIn.value, 10) || 6, 2, 20);
    const rows = clamp(parseInt(rowsIn.value, 10) || 4, 2, 20);
    let theta = 0;
    if (alignIn.checked) {
      theta = normalizeAngle(Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x));
    }
    const cosT = Math.cos(theta);
    const sinT = Math.sin(theta);

    const toUV = (x, y) => ({ u: x * cosT + y * sinT, v: -x * sinT + y * cosT });
    const toXY = (u, v) => ({ x: u * cosT - v * sinT, y: u * sinT + v * cosT });

    const uvPoly = points.map(p => toUV(p.x, p.y));
    let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
    for (const q of uvPoly) {
      if (q.u < uMin) uMin = q.u;
      if (q.u > uMax) uMax = q.u;
      if (q.v < vMin) vMin = q.v;
      if (q.v > vMax) vMax = q.v;
    }
    const spanU = uMax - uMin;
    const spanV = vMax - vMin;
    if (spanU < 2 || spanV < 2) return null;

    const cu = spanU / cols;
    const cv = spanV / rows;
    const cellArea = cu * cv;
    const labels = [];

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const u0 = uMin + c * cu;
        const u1 = u0 + cu;
        const v0 = vMin + r * cv;
        const v1 = v0 + cv;
        const clipped = clipPolyToRect(uvPoly, u0, u1, v0, v1);
        const { area, u, v } = polyAreaCentroidUV(clipped);
        if (area >= cellArea * 0.03) {
          const xy = toXY(u, v);
          labels.push({ text: colLabel(c) + (r + 1), x: xy.x, y: xy.y });
        }
      }
    }
    return { cols, rows, uMin, uMax, vMin, vMax, cu, cv, toUV, toXY, labels, theta };
  }

  function detectFeatureSectors(featPts) {
    const grid = computeGridModel();
    if (!grid || !featPts || featPts.length === 0) return [];
    const samplePts = (featPts.length === 1)
      ? [featPts[0]]
      : [...featPts, { x: polyAreaCentroidXY(featPts).cx, y: polyAreaCentroidXY(featPts).cy }];
    const found = new Set();
    for (const p of samplePts) {
      const uv = grid.toUV(p.x, p.y);
      const c = Math.floor((uv.u - grid.uMin) / grid.cu);
      const r = Math.floor((uv.v - grid.vMin) / grid.cv);
      if (c >= 0 && c < grid.cols && r >= 0 && r < grid.rows) {
        found.add(colLabel(c) + (r + 1));
      }
    }
    return Array.from(found).sort();
  }

  function formatFeatMetrics(pts, geom) {
    const L = t();
    const sectors = detectFeatureSectors(pts);
    const sep = (lang === 'ar') ? '، ' : ', ';
    const secText = !closed
      ? L.sectorNone
      : (sectors.length ? `${L.sectorPrefix} ${sectors.join(sep)}` : L.sectorOut);

    if (geom === 'point' || pts.length === 1) {
      const p = pts[0] || { x: 0, y: 0 };
      const ll = imageXYToLatLon(p.x, p.y);
      const llStr = ll ? ` | ${ll.lat.toFixed(5)}, ${ll.lon.toFixed(5)}` : '';
      return `${secText} | ${L.pinPointStat(p.x, p.y)}${llStr}`;
    }
    const { areaPx, perimeterPx } = polyAreaCentroidXY(pts);
    if (metersPerPixel) {
      const areaM2 = (areaPx * metersPerPixel * metersPerPixel).toFixed(1);
      const perimM = (perimeterPx * metersPerPixel).toFixed(1);
      return `${secText} | ${L.areaPerim(areaM2, perimM)}`;
    }
    return `${secText} | ${L.corners(pts.length)}`;
  }

  function formatId(n) {
    return 'ID-' + String(n).padStart(2, '0');
  }

  function placeLabelBox(cx, cy, bw, bh, placedBoxes) {
    let x = cx, y = cy;
    const gap = Math.max(3, bh * 0.2);
    for (let attempt = 0; attempt < 10; attempt++) {
      const collides = placedBoxes.some(b =>
        Math.abs(x - b.x) < (bw + b.w) * 0.5 &&
        Math.abs(y - b.y) < (bh + b.h) * 0.5
      );
      if (!collides) break;
      const dir = (attempt % 2 === 0) ? 1 : -1;
      const step = Math.floor(attempt / 2) + 1;
      y = cy + dir * step * (bh + gap);
    }
    placedBoxes.push({ x, y, w: bw, h: bh });
    return { x, y };
  }

  // --- Shared high-precision renderer ---
  function drawSceneOnContext(ctx, forExport) {
    if (!img) return;
    const W = img.naturalWidth;
    const H = img.naturalHeight;
    const refScale = Math.min(W, H);
    const L = t();

    ctx.drawImage(img, 0, 0);

    // 1. Dim outside village boundary
    if (closed && points.length >= 3 && dimIn.checked) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = "rgba(4, 10, 22, 0.54)";
      ctx.fill("evenodd");
      ctx.restore();
    }

    // 2. Clipped village grid
    const grid = showGridIn.checked ? computeGridModel() : null;
    if (grid) {
      const gridRef = Math.min(grid.uMax - grid.uMin, grid.vMax - grid.vMin);
      const baseLine = Math.max(1.2, gridRef / 480);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.clip();

      if (subIn.checked) {
        ctx.save();
        ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
        ctx.lineWidth = Math.max(1, baseLine * 0.7);
        ctx.setLineDash([baseLine * 4, baseLine * 4]);
        for (let c = 0; c < grid.cols; c++) {
          const u = grid.uMin + (c + 0.5) * grid.cu;
          const p0 = grid.toXY(u, grid.vMin);
          const p1 = grid.toXY(u, grid.vMax);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        }
        for (let r = 0; r < grid.rows; r++) {
          const v = grid.vMin + (r + 0.5) * grid.cv;
          const p0 = grid.toXY(grid.uMin, v);
          const p1 = grid.toXY(grid.uMax, v);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        }
        ctx.restore();
      }

      const strokeGrid = (color, lw) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.setLineDash([]);
        for (let c = 1; c < grid.cols; c++) {
          const u = grid.uMin + c * grid.cu;
          const p0 = grid.toXY(u, grid.vMin);
          const p1 = grid.toXY(u, grid.vMax);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        }
        for (let r = 1; r < grid.rows; r++) {
          const v = grid.vMin + r * grid.cv;
          const p0 = grid.toXY(grid.uMin, v);
          const p1 = grid.toXY(grid.uMax, v);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        }
      };
      strokeGrid("rgba(0, 0, 0, 0.78)", baseLine * 2.0);
      strokeGrid("rgba(255, 235, 0, 0.88)", baseLine * 1.0);

      const cellMin = Math.min(grid.cu, grid.cv);
      const fs = Math.max(10, Math.min(44, Math.round(cellMin * 0.24)));
      ctx.font = `bold ${fs}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const lbl of grid.labels) {
        const tw = ctx.measureText(lbl.text).width;
        const padX = Math.max(3, fs * 0.24);
        const padY = Math.max(2, fs * 0.16);
        const bw = tw + padX * 2;
        const bh = fs + padY * 2;
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(lbl.x - bw / 2, lbl.y - bh / 2, bw, bh);
        ctx.fillStyle = "#ffeb00";
        ctx.fillText(lbl.text, lbl.x, lbl.y + 0.5);
      }
      ctx.restore();
    }

    // 3. Village boundary border
    if (points.length > 0) {
      const borderW = forExport ? Math.max(2.4, refScale / 360) : (2.5 / zoom);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      if (closed) ctx.closePath();
      ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
      ctx.lineWidth = borderW * 1.9;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.strokeStyle = closed ? "#00f5ff" : "#38bdf8";
      ctx.lineWidth = borderW;
      ctx.stroke();
      ctx.restore();
    }

    // 4. Saved features (polygons & pins)
    if (features.length > 0) {
      const fLineW = forExport ? Math.max(2.2, refScale / 380) : (2.4 / zoom);
      const labelFs = forExport ? Math.max(12, Math.round(refScale / 56)) : Math.max(10, 12 / zoom);
      const pinR = forExport ? Math.max(6, refScale / 115) : (7.5 / zoom);

      const ordered = features
        .map((feat, origIdx) => ({ feat, origIdx }))
        .filter(item => isFeatureVisible(item.feat))
        .sort((a, b) => {
          const gA = a.feat.geometry === 'point' ? 1 : 0;
          const gB = b.feat.geometry === 'point' ? 1 : 0;
          if (gA !== gB) return gA - gB;
          return (TYPE_STYLES[a.feat.type]?.order || 4) - (TYPE_STYLES[b.feat.type]?.order || 4);
        });

      for (const { feat, origIdx } of ordered) {
        if (!feat.points || feat.points.length === 0) continue;
        const st = TYPE_STYLES[feat.type] || TYPE_STYLES.ADD;

        ctx.save();
        if (feat.geometry === 'point' || feat.points.length === 1) {
          const p = feat.points[0];
          const isDragged = !forExport && dragTarget && dragTarget.kind === 'feature' && dragTarget.featIdx === origIdx;
          const r = isDragged ? pinR * 1.3 : pinR;

          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 1.55, 0, Math.PI * 2);
          ctx.fillStyle = st.fill;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fillStyle = isDragged ? '#f59e0b' : st.stroke;
          ctx.fill();
          ctx.lineWidth = Math.max(1.5, fLineW * 0.9);
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 0.32, 0, Math.PI * 2);
          ctx.fillStyle = '#080f1d';
          ctx.fill();
        } else if (feat.points.length >= 3) {
          ctx.beginPath();
          ctx.moveTo(feat.points[0].x, feat.points[0].y);
          for (let i = 1; i < feat.points.length; i++) ctx.lineTo(feat.points[i].x, feat.points[i].y);
          ctx.closePath();

          ctx.fillStyle = st.fill;
          ctx.fill();

          ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
          ctx.lineWidth = fLineW * 1.9;
          ctx.lineJoin = "round";
          ctx.setLineDash([]);
          ctx.stroke();

          ctx.strokeStyle = st.stroke;
          ctx.lineWidth = fLineW;
          if (st.dash.length) {
            const dScale = forExport ? Math.max(1, refScale / 700) : (1 / zoom);
            ctx.setLineDash(st.dash.map(v => v * dScale));
          }
          ctx.stroke();
          ctx.setLineDash([]);

          if (!forExport && mode === 'feature' && editSavedVertices && draftPoints.length === 0) {
            const hr = 6 / zoom;
            for (let vi = 0; vi < feat.points.length; vi++) {
              const vp = feat.points[vi];
              const isDragged = dragTarget && dragTarget.kind === 'feature' && dragTarget.featIdx === origIdx && dragTarget.idx === vi;
              ctx.beginPath();
              ctx.arc(vp.x, vp.y, isDragged ? hr * 1.35 : hr, 0, Math.PI * 2);
              ctx.fillStyle = isDragged ? '#f59e0b' : st.stroke;
              ctx.fill();
              ctx.lineWidth = 1.6 / zoom;
              ctx.strokeStyle = '#ffffff';
              ctx.stroke();
            }
          }
        }
        ctx.restore();
      }

      const placedBoxes = [];
      ctx.save();
      ctx.font = `bold ${labelFs}px Tahoma, Arial, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const { feat } of ordered) {
        if (!feat.points || feat.points.length === 0) continue;
        const st = TYPE_STYLES[feat.type] || TYPE_STYLES.ADD;
        const shortType = L.shortType[feat.type] || feat.type;
        const isPin = (feat.geometry === 'point' || feat.points.length === 1);
        const anchor = isPin
          ? { cx: feat.points[0].x, cy: feat.points[0].y }
          : polyAreaCentroidXY(feat.points);

        const hasPhoto = (feat.photos && feat.photos.length > 0) || !!feat.photoRef;
        const photoCount = (feat.photos && feat.photos.length > 0) ? ` 📷${feat.photos.length}` : (feat.photoRef ? ' 📷' : '');
        const iconPrefix = isPin ? '📌 ' : '';
        const caption = feat.name
          ? `${iconPrefix}${feat.id} (${shortType}): ${feat.name}${hasPhoto ? photoCount : ''}`
          : `${iconPrefix}${feat.id} (${shortType})${hasPhoto ? photoCount : ''}`;

        const tw = ctx.measureText(caption).width;
        const px = labelFs * 0.42;
        const py = labelFs * 0.26;
        const bw = tw + px * 2;
        const bh = labelFs + py * 2;

        const targetY = isPin ? (anchor.cy - pinR * 2.1 - bh * 0.5) : anchor.cy;
        const pos = placeLabelBox(anchor.cx, targetY, bw, bh, placedBoxes);

        if (isPin || Math.hypot(pos.x - anchor.cx, pos.y - anchor.cy) > bh * 0.5) {
          ctx.beginPath();
          ctx.moveTo(anchor.cx, anchor.cy);
          ctx.lineTo(pos.x, pos.y);
          ctx.strokeStyle = st.stroke;
          ctx.lineWidth = Math.max(1, fLineW * 0.6);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(8, 15, 29, 0.88)";
        ctx.fillRect(pos.x - bw / 2, pos.y - bh / 2, bw, bh);
        ctx.strokeStyle = st.stroke;
        ctx.lineWidth = Math.max(1, fLineW * 0.65);
        ctx.strokeRect(pos.x - bw / 2, pos.y - bh / 2, bw, bh);
        ctx.fillStyle = st.badge;
        ctx.fillText(caption, pos.x, pos.y + 0.5);
      }
      ctx.restore();
    }

    // 5. Georeferencing Ground Control Points (GCP crosshair markers — live view only)
    if (!forExport && (showGcpIn.checked || mode === 'georef') && gcps.length > 0) {
      const r = 8 / zoom;
      const fs = Math.max(9, 10.5 / zoom);
      ctx.save();
      ctx.font = `bold ${fs}px monospace`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      gcps.forEach((g, idx) => {
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 3.5 / zoom;
        ctx.beginPath();
        ctx.moveTo(g.x - r * 1.6, g.y); ctx.lineTo(g.x + r * 1.6, g.y);
        ctx.moveTo(g.x, g.y - r * 1.6); ctx.lineTo(g.x, g.y + r * 1.6);
        ctx.stroke();

        ctx.strokeStyle = "#f43f5e";
        ctx.lineWidth = 1.8 / zoom;
        ctx.beginPath();
        ctx.moveTo(g.x - r * 1.6, g.y); ctx.lineTo(g.x + r * 1.6, g.y);
        ctx.moveTo(g.x, g.y - r * 1.6); ctx.lineTo(g.x, g.y + r * 1.6);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(g.x, g.y, r * 0.75, 0, Math.PI * 2);
        ctx.strokeStyle = "#f43f5e";
        ctx.lineWidth = 2 / zoom;
        ctx.stroke();

        const lbl = g.label || `GCP-${idx + 1}`;
        const tw = ctx.measureText(lbl).width;
        ctx.fillStyle = "rgba(8, 15, 29, 0.85)";
        ctx.fillRect(g.x + r * 1.4, g.y - fs * 0.7, tw + 8 / zoom, fs * 1.4);
        ctx.fillStyle = "#fda4af";
        ctx.fillText(lbl, g.x + r * 1.4 + 4 / zoom, g.y);
      });
      ctx.restore();
    }

    // 6. Live GPS Blue Dot + Accuracy Circle + Compass Heading Cone (live view only)
    if (!forExport && gpsActive && liveGps && georefModel) {
      const pos = latLonToImageXY(liveGps.lat, liveGps.lon);
      if (pos) {
        ctx.save();
        // Accuracy radius in pixels
        if (georefModel.metersPerPx && liveGps.accuracy > 0) {
          const accPx = clamp(liveGps.accuracy / georefModel.metersPerPx, 6 / zoom, Math.max(W, H) * 0.5);
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, accPx, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(56, 189, 248, 0.16)";
          ctx.fill();
          ctx.strokeStyle = "rgba(56, 189, 248, 0.65)";
          ctx.lineWidth = 1.5 / zoom;
          ctx.stroke();
        }
        // Directional heading cone if live compass is active
        if (compassActive && compassHeading !== null) {
          // Convert compass heading (0=N, 90=E) to image pixel direction vector using georef Jacobian
          const rad = compassHeading * Math.PI / 180;
          const eDir = Math.sin(rad);
          const nDir = Math.cos(rad);
          const vx = georefModel.ax * eDir + georefModel.bx * nDir;
          const vy = georefModel.ay * eDir + georefModel.by * nDir;
          const imgAngle = Math.atan2(vy, vx);
          const coneLen = 34 / zoom;
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.arc(pos.x, pos.y, coneLen, imgAngle - 0.35, imgAngle + 0.35);
          ctx.closePath();
          ctx.fillStyle = "rgba(34, 211, 238, 0.34)";
          ctx.fill();
        }
        // Core glowing GPS dot
        const dr = 8.5 / zoom;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, dr, 0, Math.PI * 2);
        ctx.fillStyle = "#0ea5e9";
        ctx.fill();
        ctx.lineWidth = 2.8 / zoom;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.restore();
      }
    }

    // 7. Draft feature polygon
    if (!forExport && draftPoints.length > 0 && modalGeom === 'polygon') {
      const lw = 2.5 / zoom;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(draftPoints[0].x, draftPoints[0].y);
      for (let i = 1; i < draftPoints.length; i++) ctx.lineTo(draftPoints[i].x, draftPoints[i].y);

      if (draftPoints.length >= 3) {
        ctx.save();
        ctx.closePath();
        ctx.fillStyle = "rgba(34, 197, 94, 0.18)";
        ctx.fill();
        ctx.restore();
      }

      ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
      ctx.lineWidth = lw * 1.9;
      ctx.lineJoin = "round";
      ctx.stroke();

      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = lw;
      ctx.stroke();

      if (draftPoints.length >= 3) {
        const last = draftPoints[draftPoints.length - 1];
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(draftPoints[0].x, draftPoints[0].y);
        ctx.strokeStyle = "rgba(74, 222, 128, 0.85)";
        ctx.lineWidth = 1.8 / zoom;
        ctx.setLineDash([6 / zoom, 5 / zoom]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (metersPerPixel && draftPoints.length >= 2) {
        const efs = Math.max(9, 11 / zoom);
        ctx.font = `bold ${efs}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let i = 1; i < draftPoints.length; i++) {
          const a = draftPoints[i - 1], b = draftPoints[i];
          const distM = Math.hypot(b.x - a.x, b.y - a.y) * metersPerPixel;
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          const txt = `${distM.toFixed(1)}m`;
          const tw = ctx.measureText(txt).width;
          ctx.fillStyle = "rgba(0,0,0,0.78)";
          ctx.fillRect(mx - tw / 2 - 3 / zoom, my - efs / 2 - 2 / zoom, tw + 6 / zoom, efs + 4 / zoom);
          ctx.fillStyle = "#86efac";
          ctx.fillText(txt, mx, my);
        }
      }

      const r = 7 / zoom;
      const vfs = Math.max(9, 11 / zoom);
      ctx.font = `bold ${vfs}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (let i = 0; i < draftPoints.length; i++) {
        const p = draftPoints[i];
        const isCloseTarget = (draftPoints.length >= 3 && i === 0);
        const isDragged = dragTarget && dragTarget.kind === 'draft' && dragTarget.idx === i;
        ctx.beginPath();
        ctx.arc(p.x, p.y, isCloseTarget ? r * 1.38 : r, 0, Math.PI * 2);
        ctx.fillStyle = isCloseTarget ? "#22c55e" : (isDragged ? "#f59e0b" : "#4ade80");
        ctx.fill();
        ctx.lineWidth = 2 / zoom;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.fillStyle = "#080f1d";
        ctx.fillText(String(i + 1), p.x, p.y + 0.5 / zoom);
      }
      ctx.restore();
    }

    // 8. Draft pin preview
    if (!forExport && draftPoints.length === 1 && modalGeom === 'point') {
      const p = draftPoints[0];
      const r = 8 / zoom;
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = "#22c55e";
      ctx.fill();
      ctx.lineWidth = 2 / zoom;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.restore();
    }

    // 9. Boundary vertex handles
    if (!forExport && mode === 'boundary' && points.length > 0) {
      const r = 7 / zoom;
      const fs = Math.max(9, 11 / zoom);
      ctx.save();
      ctx.font = `bold ${fs}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const isCloseTarget = (!closed && points.length >= 3 && i === 0);
        const isDragged = dragTarget && dragTarget.kind === 'boundary' && dragTarget.idx === i;
        ctx.beginPath();
        ctx.arc(p.x, p.y, isCloseTarget ? r * 1.35 : r, 0, Math.PI * 2);
        ctx.fillStyle = isCloseTarget ? "#22c55e" : (isDragged ? "#f59e0b" : "#0ea5e9");
        ctx.fill();
        ctx.lineWidth = 2 / zoom;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.fillStyle = "#080f1d";
        ctx.fillText(String(i + 1), p.x, p.y + 0.5 / zoom);
      }
      ctx.restore();
    }

    // 10. Scale calibration handles
    if (!forExport && mode === 'scale' && scalePoints.length > 0) {
      const r = 7 / zoom;
      ctx.save();
      if (scalePoints.length === 2) {
        ctx.beginPath();
        ctx.moveTo(scalePoints[0].x, scalePoints[0].y);
        ctx.lineTo(scalePoints[1].x, scalePoints[1].y);
        ctx.strokeStyle = "rgba(0,0,0,0.85)";
        ctx.lineWidth = 4.5 / zoom;
        ctx.stroke();
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2.4 / zoom;
        ctx.stroke();
      }
      for (const p of scalePoints) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = "#f59e0b";
        ctx.fill();
        ctx.lineWidth = 2 / zoom;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function renderView() {
    const rect = stage.getBoundingClientRect();
    vctx.clearRect(0, 0, rect.width, rect.height);
    if (!img) return;
    vctx.save();
    vctx.translate(panX, panY);
    vctx.scale(zoom, zoom);
    drawSceneOnContext(vctx, false);
    vctx.restore();
  }

  // --- UI Synchronization ---
  function renderFeaturesList() {
    const L = t();
    featCountBadge.textContent = String(features.length);
    if (features.length === 0) {
      featuresListEl.innerHTML = `<div class="feat-empty">${L.listEmpty}</div>`;
      return;
    }
    featuresListEl.innerHTML = '';

    const ordered = features
      .map((f, idx) => ({ f, idx }))
      .sort((a, b) => (TYPE_STYLES[a.f.type]?.order || 4) - (TYPE_STYLES[b.f.type]?.order || 4));

    ordered.forEach(({ f, idx }) => {
      const item = document.createElement('div');
      item.className = 'feat-item';

      const info = document.createElement('div');
      info.className = 'feat-info';

      const title = document.createElement('div');
      title.className = 'feat-title';

      const tag = document.createElement('span');
      tag.className = `tag tag-${f.type}`;
      tag.textContent = `${f.id} · ${L.shortType[f.type] || f.type}`;
      title.appendChild(tag);

      const gTag = document.createElement('span');
      gTag.className = 'tag tag-geom';
      gTag.textContent = (f.geometry === 'point') ? L.geomTagPin : L.geomTagPoly;
      title.appendChild(gTag);

      const pCount = (f.photos && f.photos.length) || 0;
      if (pCount > 0 || f.photoRef) {
        const pTag = document.createElement('span');
        pTag.className = 'tag tag-photo';
        pTag.textContent = pCount > 0 ? `📷 ${pCount}` : `📷 ${f.photoRef}`;
        title.appendChild(pTag);
      }

      const nameSpan = document.createElement('span');
      nameSpan.textContent = f.name || L.unnamed;
      title.appendChild(nameSpan);

      const meta = document.createElement('div');
      meta.className = 'feat-meta';
      const metricsStr = formatFeatMetrics(f.points, f.geometry);
      if (f.type === 'REP') {
        const rTxt = f.removeNotes ? `${L.repSummaryRem} ${f.removeNotes}` : '';
        const aTxt = f.addNotes ? `${L.repSummaryAdd} ${f.addNotes}` : '';
        const combined = [rTxt, aTxt].filter(Boolean).join(' | ');
        meta.textContent = combined ? `${metricsStr} — ${combined}` : metricsStr;
      } else {
        meta.textContent = f.notes ? `${metricsStr} — ${f.notes}` : metricsStr;
      }

      info.appendChild(title);
      info.appendChild(meta);

      if (f.photos && f.photos.length > 0) {
        const thumbRow = document.createElement('div');
        thumbRow.className = 'feat-thumbs';
        f.photos.forEach((ph, pi) => {
          const im = document.createElement('img');
          im.className = 'feat-thumb-img';
          im.src = ph.dataUrl;
          im.alt = ph.origName;
          im.title = ph.bearing ? `${ph.origName} [🧭 ${ph.bearing}]` : ph.origName;
          im.onclick = () => {
            const bStr = ph.bearing ? ` | 🧭 ${ph.bearing}` : '';
            openLightbox(ph.dataUrl, `${f.id} — ${buildPhotoExportPath(f.id, pi, ph.origName)}${bStr}`);
          };
          thumbRow.appendChild(im);
        });
        info.appendChild(thumbRow);
      }

      const actions = document.createElement('div');
      actions.className = 'feat-actions';

      const focusBtn = document.createElement('button');
      focusBtn.title = L.focusTitle;
      focusBtn.textContent = '👁️';
      focusBtn.onclick = () => {
        listDrawer.classList.remove('open');
        centerOnFeature(f);
      };

      const editBtn = document.createElement('button');
      editBtn.title = L.editTitle;
      editBtn.textContent = '✏️';
      editBtn.onclick = () => openFeatureModal(idx, f.geometry);

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-danger';
      delBtn.title = L.delTitle;
      delBtn.textContent = '🗑️';
      delBtn.onclick = () => {
        if (confirm(L.confirmDelFeat(f.id))) {
          features.splice(idx, 1);
          renderFeaturesList();
          updateUI();
          renderView();
          scheduleAutoSave();
        }
      };

      actions.appendChild(focusBtn);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      item.appendChild(info);
      item.appendChild(actions);
      featuresListEl.appendChild(item);
    });
  }

    toggleSettingsBtn.disabled = !hasImg;

    modeFeatureBtn.className  = (mode === 'feature')  ? 'btn-active-green' : '';
    modePanBtn.className      = (mode === 'pan')      ? 'btn-active' : '';
